<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>每日计划</title>
<style>
@property --p{syntax:'<number>';inherits:true;initial-value:0}
:root{--ink:#2b2740;--mute:#8b87a3;--line:#ece8f7;--bg:#f7f4ff;--brand:#7c5cff;--pink:#ff7aa2;--card:#fff;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:16px;line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom));
  background:radial-gradient(600px 400px at 100% 0,#ffe3ee 0,transparent 70%),radial-gradient(500px 500px at 0 30%,#e6f7ff 0,transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:linear-gradient(135deg,#6d5dfc 0%,#a35cf0 55%,#ff7aa2 100%);background-size:200% 200%;animation:hue 14s ease-in-out infinite;border-radius:0 0 24px 24px;box-shadow:0 10px 30px -12px rgba(109,93,252,.6)}
@keyframes hue{50%{background-position:100% 50%}}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{flex:1;font-size:20px;margin:0;letter-spacing:.5px}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:12px;padding:7px 11px;font-size:15px;backdrop-filter:blur(6px);transition:transform .15s,background .2s}
header button:active{transform:scale(.92);background:rgba(255,255,255,.32)}
#ring{--p:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;transition:--p .8s var(--ease);
  background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0)}
#ring::before{content:'';grid-area:1/1;width:36px;height:36px;border-radius:50%;background:#8e5cf2}
#sub{grid-area:1/1;position:relative;font-size:12px;font-weight:700}
#strip{display:flex;gap:5px;margin-top:10px}
.dd{flex:1;position:relative;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:14px;padding:5px 0 7px;font-size:12px;display:flex;flex-direction:column;align-items:center;transition:transform .25s var(--ease),background .25s}
.dd b{font-size:17px;line-height:1.3}
.dd i{display:block;width:60%;height:4px;border-radius:2px;background:linear-gradient(90deg,#ffd23f var(--p),rgba(255,255,255,.3) var(--p));margin-top:3px}
.dd.on{background:#fff;color:var(--brand);transform:translateY(-2px) scale(1.06);box-shadow:0 6px 16px -6px rgba(0,0,0,.3)}
.dd.on i{background:linear-gradient(90deg,var(--pink) var(--p),#eee var(--p))}
.dd.td::after{content:'';position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:#ffd23f}
.dd.ex::before{content:'🚁';position:absolute;top:-6px;left:-2px;font-size:12px}
.dd.cny::before{content:'🧧';position:absolute;top:-6px;left:-2px;font-size:12px}
.dd.nye::before{content:'🎉';position:absolute;top:-6px;left:-2px;font-size:12px}
.dd.full b{color:#ffd23f}.dd.on.full b{color:var(--pink)}
.dd:disabled{opacity:.3}
main{max-width:760px;margin:0 auto;padding:12px}
main.enter>.card,main.enter>.stage,main.enter>.log,main.enter .item{animation:up .5s var(--ease) both;animation-delay:calc(min(var(--i,0),14)*35ms)}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.stage{background:var(--card);border-radius:20px;padding:12px 16px;margin-bottom:12px;box-shadow:0 8px 24px -14px rgba(80,60,180,.35);position:relative;overflow:hidden}
.stage::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#6d5dfc,#ff7aa2,#ffd23f)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.chip{font-size:12px;padding:2px 10px;border-radius:20px;background:#f0ecff;color:var(--brand);font-weight:600}
.chip.hot{background:linear-gradient(90deg,#ff4d8d,#ff9a5a);color:#fff;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.06)}16%{transform:scale(1)}}
.sname{font-weight:700;font-size:17px}
.goals label{display:flex;gap:8px;font-size:14px;padding:4px 0;align-items:flex-start}
.goals input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex-shrink:0;margin-top:1px;border-radius:6px;border:2px solid #cfc6f5;transition:all .2s;display:grid;place-items:center}
.goals input:checked{background:var(--brand);border-color:var(--brand)}
.goals input:checked::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.goals input:checked+span{color:var(--mute);text-decoration:line-through}
.stop{font-size:13px;color:#c2410c;background:#fff4ec;border-radius:10px;padding:6px 10px;margin:8px 0 2px}
.item{--c:#a3a8c3;position:relative;display:grid;grid-template-columns:44px 36px 1fr 36px;gap:10px;align-items:start;background:var(--card);border-radius:18px;padding:12px 12px 12px 14px;margin:8px 0;
  box-shadow:0 6px 18px -12px rgba(80,60,180,.4);overflow:hidden;transition:opacity .35s,transform .2s var(--ease),box-shadow .3s}
.item::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.item.has:active{transform:scale(.985)}
.item .tm{font-size:14px;font-weight:700;color:var(--ink);line-height:1.25;padding-top:6px}
.item .tm span{display:block;font-weight:400;color:var(--mute);font-size:12px}
.item .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:#f3f0ff;background:color-mix(in srgb,var(--c) 16%,#fff)}
.item .bd{min-width:0;padding-top:6px}
.item .tt{font-weight:600;background:linear-gradient(currentColor,currentColor) no-repeat 0 55%/0 1.5px;transition:background-size .45s var(--ease),color .3s;display:inline}
.item.has .bd::after{content:'展开 ›';display:block;font-size:12px;color:var(--mute);margin-top:2px;transition:opacity .2s}
.item.open .bd::after{content:'收起 ‹'}
.dtw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.item.open .dtw{grid-template-rows:1fr}
.dt{min-height:0;overflow:hidden;font-size:14px;color:#4a4560}
.item.open .dt{padding-top:8px}
.dt table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.dt td,.dt th,.card td,.card th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.dt th,.card th{background:#faf8ff}
.dt ol,.dt ul{padding-left:20px;margin:4px 0}
.drt{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.drt input{display:block;width:120px;font-size:16px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;margin-top:4px;font-family:inherit}
.ck{width:34px;height:34px;margin-top:2px;border-radius:50%;border:2px solid #d6cff5;background:#fff;padding:0;display:grid;place-items:center;transition:all .3s var(--ease)}
.ck svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s var(--ease)}
.ck:active{transform:scale(.85)}
.item.done{opacity:.62}
.item.done .ck{background:linear-gradient(135deg,#2ec4b6,#5bd68a);border-color:transparent;box-shadow:0 4px 12px -4px #2ec4b6}
.item.done .ck svg{stroke-dashoffset:0}
.item.done .tt{background-size:100% 1.5px;color:var(--mute)}
.item.pop .ck{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.3)}100%{transform:scale(1)}}
.item.now{box-shadow:0 0 0 2px var(--c),0 10px 26px -10px var(--c);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 10px 26px -10px var(--c)}}
.nowtag{background:var(--c);color:#fff;font-size:11px;padding:1px 8px;border-radius:10px;vertical-align:2px}
.c-run,.c-gym{--c:#ff6b6b}.c-meal{--c:#ffa94d}.c-cls,.c-school{--c:#4d96ff}.c-biz{--c:#7c5cff}
.c-drone{--c:#ff4d8d}.c-exam{--c:#e63946}.c-word,.c-wrev,.c-gram,.c-listen{--c:#2ec4b6}.c-read{--c:#c08b5c}.c-makeup{--c:#ff7ac6}
.c-go,.c-back{--c:#8a94a6}.c-meet{--c:#ffb84d}.c-trip{--c:#3d7ea6}
.c-exam .tt{color:#e63946}
.tip{color:#9a6b2f;font-size:13px}
.lopen{display:block;margin:6px 0;padding:9px 14px;border-radius:12px;border:0;background:linear-gradient(135deg,#2ec4b6,#4d96ff);color:#fff;font-size:14px}
.log,.card{background:var(--card);border-radius:20px;padding:12px 16px;margin:12px 0;box-shadow:0 8px 24px -14px rgba(80,60,180,.35)}
.card.hero{background:linear-gradient(135deg,#f0ecff,#ffeef5)}
.log h3,.card h3{margin:4px 0 8px;font-size:17px;background:linear-gradient(90deg,#6d5dfc,#ff4d8d);-webkit-background-clip:text;background-clip:text;color:transparent}
.log label{display:block;font-size:14px;margin:10px 0;color:var(--mute)}
.log input,.log textarea{display:block;width:100%;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin-top:4px;font-family:inherit;color:var(--ink);transition:border-color .2s,box-shadow .2s;background:#fdfcff}
.log input:focus,.log textarea:focus,.drt input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(124,92,255,.15)}
.card table{border-collapse:collapse;width:100%;font-size:13px}
.card tr[data-go]{cursor:pointer;transition:background .2s}.card tr[data-go]:active{background:#f3f0ff}
.card ul,.card ol{padding-left:20px}
.steps li{margin:6px 0}
.part{font-size:13px;color:var(--mute);margin:12px 0 4px;font-weight:600}
.lrow{display:block;width:100%;text-align:left;background:#f7f5ff;border:0;border-radius:12px;padding:10px 12px;margin:4px 0;font-size:15px;color:var(--ink);transition:transform .15s,background .2s}
.lrow:active{transform:scale(.98);background:#ece7ff}
nav{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;z-index:6;display:flex;max-width:744px;margin:0 auto;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:5px;box-shadow:0 10px 30px -10px rgba(80,60,180,.45)}

nav button.on{color:var(--brand);font-weight:700;background:linear-gradient(135deg,#efeaff,#ffe9f1)}
nav button.on b{transform:translateY(-2px) scale(1.15);animation:bob .5s var(--ease)}
@keyframes bob{40%{transform:translateY(-6px) scale(1.2)}}
#lesson{position:fixed;inset:0;z-index:9;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 40px;display:none;-webkit-overflow-scrolling:touch}
#lesson.show{display:block;animation:slide .35s var(--ease)}
@keyframes slide{from{transform:translateY(30px);opacity:0}}
.lhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.lhead button,.lbtn button{border:0;border-radius:12px;padding:9px 14px;background:var(--brand);color:#fff;font-size:15px}
#lesson h2{color:var(--brand);border-bottom:3px solid #ffd23f}
#lesson .note{background:#fffdf5;border:2px dashed #e0b84c;border-radius:12px;padding:4px 12px}
#lesson .note b{color:#c0392b}
#lesson table{border-collapse:collapse;width:100%;font-size:14px}
#lesson td,#lesson th{border:1px solid #e3dcff;padding:4px 6px}
.ex{display:flex;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:0 4px 14px -10px rgba(80,60,180,.4)}
.play{width:38px;height:38px;flex-shrink:0;border-radius:50%;border:0;background:linear-gradient(135deg,#7c5cff,#ff7aa2);color:#fff}
.en{font-size:18px;font-family:Georgia,serif}
.q{background:#fff;border-radius:14px;padding:12px;margin:10px 0}
.opt{margin:4px 6px 4px 0;padding:7px 14px;font-size:16px;border-radius:12px;border:2px solid #d6cff5;background:#fff;transition:all .2s}
.opt.right{background:#2ec4b6;color:#fff;border-color:#2ec4b6;animation:pop .4s}.opt.wrong{background:#ff6b6b;color:#fff;border-color:#ff6b6b;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.lbtn .mk{background:#2ec4b6}
#exp,.imp{border:0;border-radius:12px;padding:9px 14px;background:var(--brand);color:#fff;font-size:15px;display:inline-block}
.imp input{display:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.8s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

LESSONS.push({id:'start', part:'第0部分 开始之前', title:'0. 怎么用这本手册', body:`
<div class="kj">
<p>👋 欢迎！这本手册专门给<b>零基础</b>的你。每一课都分成三块：</p>
<p>1️⃣ <b>黄色虚线框「抄到笔记本」</b>：这是重点，请一字一字抄下来。<br>
2️⃣ <b>带 ▶ 按钮的例句</b>：点 ▶ 听整句读音；点句子里<b>任意一个单词</b>，可以单独听这个词。<br>
3️⃣ <b>📝 小练习</b>：点你认为对的答案，会马上告诉你对错，并读出正确句子。</p>
</div>
<div class="note">
<h3>学习方法</h3>
<p>① 每天学 <b>1 课</b>就够，不要贪多。<br>
② 先听例句 3 遍，再<b>跟着大声读</b> 3 遍。<br>
③ 把黄框内容抄到笔记本，例句也抄。<br>
④ 做完练习，点最下面「我学会了，打勾」，左边目录会出现 ✔。<br>
⑤ 第二天开始前，先复习前一天的笔记 5 分钟。</p>
</div>
<p class="small">🔊 声音小贴士：最好用 <b>Microsoft Edge 浏览器</b>打开本文件，顶部「声音」里会有带 ★自然 的声音，最像真人。读得太快可以把「语速」改成「很慢」。</p>
<ex en="Hello! Let's learn English together." zh="你好！我们一起学英语吧。" tip="点 ▶ 试试听，再点单词 English 单独听。"/>
`});

LESSONS.push({id:'sentence', part:'第0部分 开始之前', title:'1. 句子像搭积木', body:`
<p>中文和英文其实很像，一句话基本都是：<b>谁 + 做什么 + 对什么</b>。</p>
<div class="note">
<h3>句子的三块积木</h3>
<table>
<tr><th>积木</th><th>名字</th><th>意思</th><th>例子</th></tr>
<tr><td>第1块</td><td><b>主语</b></td><td>「谁」或「什么东西」</td><td>I（我）</td></tr>
<tr><td>第2块</td><td><b>谓语</b>（动词）</td><td>「做什么」或「是什么」</td><td>like（喜欢）</td></tr>
<tr><td>第3块</td><td><b>宾语</b></td><td>动作「对着谁 / 什么」</td><td>apples（苹果）</td></tr>
</table>
<p>👉 <b>I like apples.</b> = 我 喜欢 苹果。</p>
<p>⭐ 规则1：英语句子<b>第一个字母要大写</b>。<br>
⭐ 规则2：句子最后要有标点：陈述句用 <b>.</b>（英文句号是一个小圆点，不是「。」），问句用 <b>?</b><br>
⭐ 规则3：<b>I（我）永远大写</b>，不管在句子哪里。<br>
⭐ 规则4：单词和单词之间要<b>空一格</b>。</p>
</div>
<ex en="I like apples." zh="我喜欢苹果。" tip="I=我，like=喜欢，apples=苹果"/>
<ex en="She reads books." zh="她读书。" tip="She=她，reads=读，books=书"/>
<ex en="Tom plays football." zh="汤姆踢足球。"/>
<div class="kj">好消息：英语和中文的<b>词序几乎一样</b>（主语 → 动词 → 宾语）。所以很多句子你可以「一个词对一个词」地翻译。</div>
<quiz q="「我爱你」用英语怎么说？" opts="Love I you.|I love you.|You love I." ans="1" why="顺序是 主语 I + 动词 love + 宾语 you。" en="I love you."/>
<quiz q="哪一句写法是对的？" opts="i like cats.|I like cats.|I like cats。" ans="1" why="I 和句首字母要大写，句尾用英文小圆点 . 。" en="I like cats."/>
`});

LESSONS.push({id:'pos', part:'第0部分 开始之前', title:'2. 单词的十种「身份」（词性）', body:`
<p>每个英语单词都有一个「身份」，叫<b>词性</b>。知道身份，才知道它该放在句子哪里。</p>
<div class="note">
<h3>十大词性（简写 + 意思）</h3>
<table>
<tr><th>词性</th><th>简写</th><th>最白话的解释</th><th>例子</th></tr>
<tr><td>名词</td><td>n.</td><td>东西、人、地方的名字</td><td>book 书，Tom 汤姆</td></tr>
<tr><td>代词</td><td>pron.</td><td>代替名词，免得重复</td><td>I 我，he 他，it 它</td></tr>
<tr><td>动词</td><td>v.</td><td>动作或状态</td><td>run 跑，eat 吃，is 是</td></tr>
<tr><td>形容词</td><td>adj.</td><td>说明东西「怎么样」</td><td>big 大的，red 红的</td></tr>
<tr><td>副词</td><td>adv.</td><td>说明动作「怎么做」</td><td>fast 快地，very 很</td></tr>
<tr><td>数词</td><td>num.</td><td>数字、第几</td><td>one 一，first 第一</td></tr>
<tr><td>冠词</td><td>art.</td><td>放在名词前的小帽子</td><td>a，an，the</td></tr>
<tr><td>介词</td><td>prep.</td><td>表示位置、时间等关系</td><td>in 在…里，on 在…上</td></tr>
<tr><td>连词</td><td>conj.</td><td>把词或句子连起来</td><td>and 和，but 但是</td></tr>
<tr><td>感叹词</td><td>interj.</td><td>表示情绪的叫声</td><td>oh 哦，wow 哇</td></tr>
</table>
<p>💡 查字典时，单词后面写的 n. v. adj. 就是这个词的身份。</p>
</div>
<ex en="The big dog runs fast." zh="那只大狗跑得很快。" tip="The=冠词，big=形容词，dog=名词，runs=动词，fast=副词"/>
<ex en="I am in the room." zh="我在房间里。" tip="I=代词，am=动词，in=介词，the=冠词，room=名词"/>
<ex en="Wow, one red apple and one green apple!" zh="哇，一个红苹果和一个青苹果！" tip="Wow=感叹词，one=数词，red/green=形容词，and=连词"/>
<quiz q="apple（苹果）是什么词性？" opts="动词|名词|形容词" ans="1" why="苹果是一个东西的名字，所以是名词。" en="apple"/>
<quiz q="happy（开心的）是什么词性？" opts="形容词|副词|介词" ans="0" why="它说明人「怎么样」，是形容词。" en="happy"/>
<quiz q="run（跑）是什么词性？" opts="名词|连词|动词" ans="2" why="跑是一个动作，所以是动词。" en="run"/>
`});

;
LESSONS.push({id:'noun', part:'第1部分 认识单词', title:'3. 名词：一个和很多个', body:`
<p>名词就是东西的名字。英语里最重要的一件事：<b>一个</b>和<b>很多个</b>写法不一样。中文说「一本书、三本书」，「书」不变；英语会变：book → books。</p>
<div class="note">
<h3>① 可数名词 和 不可数名词</h3>
<p><b>可数名词</b>：能一个一个数的。apple 苹果、book 书、cat 猫。<br>
<b>不可数名词</b>：没法一个一个数的。water 水、milk 牛奶、rice 米饭、money 钱、bread 面包、information 信息。<br>
⭐ 不可数名词<b>没有复数</b>，不能加 s，前面也不能加 a。<br>
⭐ 想数不可数名词，要借「单位」：a cup of water（一杯水），two bottles of milk（两瓶牛奶），a piece of bread（一片面包）。</p>
<h3>② 单数变复数的规则</h3>
<table>
<tr><th>规则</th><th>做法</th><th>例子</th></tr>
<tr><td>一般情况</td><td>直接加 <b>s</b></td><td>book → books，cat → cats</td></tr>
<tr><td>以 s, x, ch, sh 结尾</td><td>加 <b>es</b></td><td>bus → buses，box → boxes，watch → watches</td></tr>
<tr><td>辅音字母 + y 结尾</td><td>变 y 为 i，加 <b>es</b></td><td>baby → babies，city → cities</td></tr>
<tr><td>元音字母 + y 结尾</td><td>直接加 s</td><td>boy → boys，day → days</td></tr>
<tr><td>以 f 或 fe 结尾</td><td>变 f/fe 为 v，加 <b>es</b></td><td>leaf → leaves，knife → knives</td></tr>
<tr><td>以 o 结尾</td><td>有生命的加 es，其他加 s</td><td>tomato → tomatoes，potato → potatoes，photo → photos</td></tr>
<tr><td>不规则（要背）</td><td>整个词变</td><td>man → men，woman → women，child → children，foot → feet，tooth → teeth，mouse → mice</td></tr>
<tr><td>单复数一样</td><td>不变</td><td>sheep 羊，fish 鱼，deer 鹿，Chinese 中国人</td></tr>
</table>
<p>💡 元音字母只有 5 个：<b>a e i o u</b>，其他 21 个都是辅音字母。</p>
</div>
<ex en="I have one book." zh="我有一本书。"/>
<ex en="I have three books." zh="我有三本书。" tip="多于一个，book 后面加 s"/>
<ex en="There are two boxes on the desk." zh="桌子上有两个盒子。" tip="box 以 x 结尾，加 es"/>
<ex en="The children are playing." zh="孩子们正在玩。" tip="child 的复数是 children，不规则"/>
<ex en="Can I have a cup of water?" zh="能给我一杯水吗？" tip="water 不可数，用 a cup of 来数"/>
<quiz q="box（盒子）的复数是？" opts="boxs|boxes|boxies" ans="1" why="以 x 结尾加 es。" en="boxes"/>
<quiz q="baby（婴儿）的复数是？" opts="babys|babies|babyes" ans="1" why="辅音字母 b + y 结尾，变 y 为 i 加 es。" en="babies"/>
<quiz q="哪一个是对的？" opts="two waters|a water|some water" ans="2" why="water 不可数，不能加 s，也不能用 a。可以说 some water（一些水）。" en="some water"/>
`});

LESSONS.push({id:'article', part:'第1部分 认识单词', title:'4. 冠词：a / an / the', body:`
<p>冠词是戴在名词头上的「小帽子」。中文没有这个东西，所以要特别记。</p>
<div class="note">
<h3>① a 和 an：「一个」，泛指（随便哪一个）</h3>
<p>只能用在<b>单数可数名词</b>前面。<br>
⭐ 后面单词的<b>读音</b>以辅音开头 → 用 <b>a</b>：a book，a cat，a university（u 读「优」，是辅音音）<br>
⭐ 后面单词的<b>读音</b>以元音开头 → 用 <b>an</b>：an apple，an egg，an hour（h 不发音）<br>
记住：看<b>读音</b>，不是看字母！</p>
<h3>② the：「这个 / 那个」，特指（说话双方都知道是哪个）</h3>
<p>1. 前面提过的东西，再说时用 the。<br>
2. 世界上独一无二的：the sun 太阳，the moon 月亮，the earth 地球。<br>
3. 序数词和最高级前：the first 第一，the best 最好的。<br>
4. 乐器前：play the piano 弹钢琴。<br>
5. 双方都知道的：Close the door.（关上门。你知道是哪扇门）</p>
<h3>③ 不用冠词的情况</h3>
<p>1. 三餐：have breakfast / lunch / dinner<br>
2. 球类运动：play football / basketball<br>
3. 学科、语言：English，math<br>
4. 星期、月份：on Monday，in May<br>
5. 名字前：Tom，China</p>
</div>
<ex en="I have a cat." zh="我有一只猫。" tip="cat 读音以辅音开头，用 a"/>
<ex en="She eats an apple every day." zh="她每天吃一个苹果。" tip="apple 以元音开头，用 an"/>
<ex en="I saw a dog. The dog was very cute." zh="我看见一只狗。那只狗很可爱。" tip="第一次提到用 a，第二次说同一只狗用 the"/>
<ex en="The sun is hot." zh="太阳很热。" tip="太阳只有一个，用 the"/>
<ex en="I play football after school." zh="我放学后踢足球。" tip="球类运动前不用冠词"/>
<quiz q="___ egg（一个鸡蛋）" opts="a|an|the" ans="1" why="egg 以元音音开头，用 an。" en="an egg"/>
<quiz q="___ hour（一个小时）" opts="a|an" ans="1" why="hour 的 h 不发音，读音以元音开头，用 an。" en="an hour"/>
<quiz q="He plays ___ piano.（他弹钢琴）" opts="a|the|不填" ans="1" why="乐器前用 the。" en="He plays the piano."/>
`});

LESSONS.push({id:'pronoun', part:'第1部分 认识单词', title:'5. 代词：我、你、他', body:`
<p>代词用来代替名词。比如「汤姆很高。<b>他</b>喜欢篮球」，「他」就是代词。</p>
<div class="note">
<h3>① 人称代词 + 物主代词 + 反身代词 总表（最重要，必抄！）</h3>
<table>
<tr><th>中文</th><th>主格<br>（放动词前）</th><th>宾格<br>（放动词/介词后）</th><th>形容词性物主代词<br>（…的 + 名词）</th><th>名词性物主代词<br>（…的，后面不跟名词）</th><th>反身代词<br>（…自己）</th></tr>
<tr><td>我</td><td>I</td><td>me</td><td>my</td><td>mine</td><td>myself</td></tr>
<tr><td>你</td><td>you</td><td>you</td><td>your</td><td>yours</td><td>yourself</td></tr>
<tr><td>他</td><td>he</td><td>him</td><td>his</td><td>his</td><td>himself</td></tr>
<tr><td>她</td><td>she</td><td>her</td><td>her</td><td>hers</td><td>herself</td></tr>
<tr><td>它</td><td>it</td><td>it</td><td>its</td><td>its</td><td>itself</td></tr>
<tr><td>我们</td><td>we</td><td>us</td><td>our</td><td>ours</td><td>ourselves</td></tr>
<tr><td>你们</td><td>you</td><td>you</td><td>your</td><td>yours</td><td>yourselves</td></tr>
<tr><td>他们/她们/它们</td><td>they</td><td>them</td><td>their</td><td>theirs</td><td>themselves</td></tr>
</table>
<p>⭐ <b>主格</b>做主语（谁在做）：<b>He</b> likes me.<br>
⭐ <b>宾格</b>做宾语（被做的人）：He likes <b>me</b>.（不能说 He likes I）<br>
⭐ <b>my/your/his…</b> 后面必须跟名词：my book（我的书）<br>
⭐ <b>mine/yours/his…</b> 后面不跟名词：This book is <b>mine</b>.（这本书是我的）</p>
<h3>② 指示代词</h3>
<table>
<tr><th></th><th>近处（这）</th><th>远处（那）</th></tr>
<tr><td>单数</td><td>this 这个</td><td>that 那个</td></tr>
<tr><td>复数</td><td>these 这些</td><td>those 那些</td></tr>
</table>
<h3>③ 不定代词（常用）</h3>
<p>some 一些（肯定句）/ any 一些、任何（否定句和疑问句）<br>
everyone 每个人，someone 某人，nobody 没有人，everything 每件事，something 某事，nothing 没什么<br>
⭐ everyone / someone / nothing 这类词当<b>单数</b>用：Everyone <b>is</b> here.</p>
</div>
<ex en="He likes me." zh="他喜欢我。" tip="He 是主格，me 是宾格"/>
<ex en="I like him." zh="我喜欢他。" tip="换过来：I 是主格，him 是宾格"/>
<ex en="This is my book. That book is yours." zh="这是我的书。那本书是你的。" tip="my 后面跟 book；yours 后面不跟名词"/>
<ex en="These apples are red." zh="这些苹果是红的。" tip="these 后面跟复数"/>
<ex en="She can do it herself." zh="她自己能做这件事。"/>
<ex en="Do you have any questions?" zh="你有什么问题吗？" tip="疑问句用 any"/>
<quiz q="___ is my friend.（他是我的朋友）" opts="Him|He|His" ans="1" why="放在句首做主语，用主格 He。" en="He is my friend."/>
<quiz q="Please help ___.（请帮帮我）" opts="I|my|me" ans="2" why="放在动词 help 后面做宾语，用宾格 me。" en="Please help me."/>
<quiz q="This pen is ___.（这支笔是她的）" opts="her|hers|she" ans="1" why="后面没有名词，用名词性物主代词 hers。" en="This pen is hers."/>
`});

LESSONS.push({id:'be', part:'第1部分 认识单词', title:'6. be 动词：am / is / are', body:`
<p>be 动词的意思是「是」，也可以表示「在」。它是英语里<b>最常用</b>的动词，一定要先学会。</p>
<div class="note">
<h3>口诀：我用 am，你用 are，is 跟着他她它，复数全部用 are</h3>
<table>
<tr><th>主语</th><th>现在</th><th>过去</th><th>缩写</th></tr>
<tr><td>I</td><td><b>am</b></td><td>was</td><td>I'm</td></tr>
<tr><td>he / she / it / 单个人或东西</td><td><b>is</b></td><td>was</td><td>he's, she's, it's</td></tr>
<tr><td>you / we / they / 复数</td><td><b>are</b></td><td>were</td><td>you're, we're, they're</td></tr>
</table>
<h3>be 动词后面可以接</h3>
<p>1. 名词（是什么）：I am <b>a teacher</b>.<br>
2. 形容词（怎么样）：She is <b>happy</b>.<br>
3. 地点（在哪里）：They are <b>at home</b>.<br>
4. 年龄：I am <b>20</b>.</p>
<h3>变否定和疑问（超简单）</h3>
<p>否定：be 后面加 <b>not</b>。is not = isn't，are not = aren't（am not 没有缩写）<br>
疑问：把 be 动词<b>挪到句首</b>，句尾改成问号。<br>
He is a student. → He <b>is not</b> a student. → <b>Is</b> he a student?<br>
回答：Yes, he is. / No, he isn't.</p>
<p>⚠️ 中文的「我很开心」没有「是」，但英语<b>必须有 be 动词</b>：I am happy.（不能说 I happy.）</p>
</div>
<ex en="I am a student." zh="我是一名学生。"/>
<ex en="She is very happy." zh="她很开心。" tip="中文没有「是」，英语必须加 is"/>
<ex en="We are at home." zh="我们在家。" tip="be 动词也可以表示「在」"/>
<ex en="He is not a teacher." zh="他不是老师。"/>
<ex en="Are you tired? Yes, I am." zh="你累了吗？是的，我累了。"/>
<quiz q="They ___ my friends." opts="am|is|are" ans="2" why="they 是复数，用 are。" en="They are my friends."/>
<quiz q="My mother ___ a doctor." opts="am|is|are" ans="1" why="my mother 是一个人（单数），相当于 she，用 is。" en="My mother is a doctor."/>
<quiz q="「我很忙」怎么说？" opts="I busy.|I am busy.|I is busy." ans="1" why="形容词前必须有 be 动词，I 用 am。" en="I am busy."/>
`});

;
LESSONS.push({id:'verb', part:'第1部分 认识单词', title:'7. 实义动词和三单', body:`
<p>除了 be 动词，其他表示动作的词叫<b>实义动词</b>：eat 吃，go 去，like 喜欢，have 有……</p>
<div class="note">
<h3>① 一个句子里，一般只能有一个「主动词」</h3>
<p>❌ I am like apples.（am 和 like 同时出现，错！）<br>
✅ I like apples.</p>
<h3>② 「三单」规则（最容易错的地方）</h3>
<p>当主语是 <b>he / she / it / 一个人 / 一个东西</b>（叫「第三人称单数」，简称<b>三单</b>），而且说的是<b>现在的事</b>时，动词要加 <b>s 或 es</b>。</p>
<table>
<tr><th>规则</th><th>例子</th></tr>
<tr><td>一般加 s</td><td>like → likes，play → plays</td></tr>
<tr><td>以 s, x, ch, sh, o 结尾，加 es</td><td>go → goes，do → does，watch → watches，wash → washes</td></tr>
<tr><td>辅音 + y 结尾，变 y 为 i 加 es</td><td>study → studies，fly → flies</td></tr>
<tr><td>特殊</td><td>have → <b>has</b></td></tr>
</table>
<p>I like / You like / We like / They like<br>
He <b>likes</b> / She <b>likes</b> / Tom <b>likes</b> / My cat <b>likes</b></p>
<h3>③ 动词的五种样子（以后会全部用到）</h3>
<table>
<tr><th>原形</th><th>三单</th><th>过去式</th><th>过去分词</th><th>-ing 形式</th></tr>
<tr><td>work 工作</td><td>works</td><td>worked</td><td>worked</td><td>working</td></tr>
<tr><td>go 去</td><td>goes</td><td>went</td><td>gone</td><td>going</td></tr>
<tr><td>eat 吃</td><td>eats</td><td>ate</td><td>eaten</td><td>eating</td></tr>
</table>
</div>
<ex en="I like music." zh="我喜欢音乐。"/>
<ex en="He likes music." zh="他喜欢音乐。" tip="He 是三单，like 要加 s"/>
<ex en="My sister watches TV every night." zh="我妹妹每天晚上看电视。" tip="watch 以 ch 结尾，加 es"/>
<ex en="She has a big house." zh="她有一栋大房子。" tip="have 遇到三单变 has"/>
<quiz q="She ___ English every day." opts="study|studys|studies" ans="2" why="三单；study 是辅音+y 结尾，变 y 为 i 加 es。" en="She studies English every day."/>
<quiz q="We ___ to school by bus." opts="go|goes" ans="0" why="we 不是三单，用原形 go。" en="We go to school by bus."/>
<quiz q="哪一句对？" opts="I am eat rice.|I eat rice.|I eats rice." ans="1" why="一个句子一个主动词；I 不是三单，不加 s。" en="I eat rice."/>
`});

LESSONS.push({id:'adj', part:'第1部分 认识单词', title:'8. 形容词和副词', body:`
<div class="note">
<h3>① 形容词：说明「人或东西」怎么样</h3>
<p>放两个位置：<br>
1. <b>名词前面</b>：a <b>red</b> apple（一个红苹果）<br>
2. <b>be 动词后面</b>：The apple is <b>red</b>.（这个苹果是红的）<br>
⭐ 形容词<b>没有单复数变化</b>：two red apples（不能写 reds）</p>
<h3>② 副词：说明「动作」怎么样，或修饰形容词</h3>
<p>1. 修饰动词：He runs <b>fast</b>.（他跑得快）<br>
2. 修饰形容词：It is <b>very</b> good.（非常好）<br>
⭐ 很多副词 = 形容词 + <b>ly</b>：<br>
slow 慢的 → slowly 慢慢地；quick 快的 → quickly 快速地；happy 开心的 → happily 开心地（y 变 i）；careful 小心的 → carefully 小心地<br>
⭐ 特殊：good 好的 → <b>well</b> 好地；fast / hard 形容词和副词一样</p>
<h3>③ 频率副词（多久一次）</h3>
<p>always 总是 (100%) &gt; usually 通常 (80%) &gt; often 经常 (60%) &gt; sometimes 有时 (40%) &gt; seldom 很少 (10%) &gt; never 从不 (0%)<br>
位置：放在<b>实义动词前</b>、<b>be 动词后</b>。<br>
I <b>always</b> get up early. / He is <b>always</b> late.</p>
</div>
<ex en="She has a beautiful voice." zh="她有一副美丽的嗓音。" tip="beautiful 是形容词，放在名词 voice 前"/>
<ex en="The weather is nice today." zh="今天天气很好。" tip="nice 放在 be 动词 is 后"/>
<ex en="Please speak slowly." zh="请说慢一点。" tip="slowly 是副词，修饰动作 speak"/>
<ex en="He sings very well." zh="他唱歌唱得很好。" tip="修饰动作用 well，不用 good"/>
<ex en="I usually drink coffee in the morning." zh="我通常早上喝咖啡。"/>
<quiz q="She is a ___ girl." opts="beautiful|beautifully" ans="0" why="修饰名词 girl，用形容词。" en="She is a beautiful girl."/>
<quiz q="He drives ___.（他开车很小心）" opts="careful|carefully" ans="1" why="修饰动作 drives，用副词。" en="He drives carefully."/>
<quiz q="哪一句对？" opts="I never am late.|I am never late." ans="1" why="频率副词放在 be 动词后面。" en="I am never late."/>
`});

LESSONS.push({id:'compare', part:'第1部分 认识单词', title:'9. 比较级和最高级', body:`
<p>比较两个东西用<b>比较级</b>（更……）；三个或以上里面选第一用<b>最高级</b>（最……）。</p>
<div class="note">
<h3>① 变化规则</h3>
<table>
<tr><th>规则</th><th>原级</th><th>比较级（更）</th><th>最高级（最）</th></tr>
<tr><td>一般加 er / est</td><td>tall 高</td><td>taller</td><td>tallest</td></tr>
<tr><td>以 e 结尾加 r / st</td><td>nice 好</td><td>nicer</td><td>nicest</td></tr>
<tr><td>辅音+y 结尾，变 y 为 i</td><td>happy 开心</td><td>happier</td><td>happiest</td></tr>
<tr><td>重读闭音节，双写尾字母</td><td>big 大</td><td>bigger</td><td>biggest</td></tr>
<tr><td>长单词（多音节）前加 more / most</td><td>beautiful 美丽</td><td>more beautiful</td><td>most beautiful</td></tr>
</table>
<p>💡 需要双写的常见词：big, hot, fat, thin, sad, wet → bigger, hotter, fatter, thinner…</p>
<h3>② 不规则（必背）</h3>
<table>
<tr><th>原级</th><th>比较级</th><th>最高级</th></tr>
<tr><td>good / well 好</td><td>better</td><td>best</td></tr>
<tr><td>bad 坏</td><td>worse</td><td>worst</td></tr>
<tr><td>many / much 多</td><td>more</td><td>most</td></tr>
<tr><td>little 少</td><td>less</td><td>least</td></tr>
<tr><td>far 远</td><td>farther / further</td><td>farthest / furthest</td></tr>
</table>
<h3>③ 三个句型</h3>
<p>1. A 比 B 更…：A + be + <b>比较级 + than</b> + B<br>
2. A 是…中最…的：A + be + <b>the + 最高级</b> + in/of…<br>
3. A 和 B 一样…：A + be + <b>as + 原级 + as</b> + B（不一样：not as…as）</p>
</div>
<ex en="Tom is taller than me." zh="汤姆比我高。"/>
<ex en="This book is more interesting than that one." zh="这本书比那本有趣。" tip="interesting 是长单词，用 more"/>
<ex en="She is the tallest girl in our class." zh="她是我们班最高的女生。" tip="最高级前面要加 the"/>
<ex en="Today is better than yesterday." zh="今天比昨天好。"/>
<ex en="My bag is as big as yours." zh="我的包和你的一样大。"/>
<quiz q="An elephant is ___ than a dog." opts="big|bigger|biggest" ans="1" why="两者比较、有 than，用比较级；big 要双写 g。" en="An elephant is bigger than a dog."/>
<quiz q="This is the ___ day of my life." opts="good|better|best" ans="2" why="the …of my life 表示「最」，good 的最高级是 best。" en="This is the best day of my life."/>
<quiz q="She is as ___ as her mother." opts="tall|taller|tallest" ans="0" why="as…as 中间用原级。" en="She is as tall as her mother."/>
`});

LESSONS.push({id:'num', part:'第1部分 认识单词', title:'10. 数词、时间和日期', body:`
<div class="note">
<h3>① 基数词（一、二、三）</h3>
<p>1 one，2 two，3 three，4 four，5 five，6 six，7 seven，8 eight，9 nine，10 ten<br>
11 eleven，12 twelve，13 thirteen，14 fourteen，15 fifteen，16 sixteen，17 seventeen，18 eighteen，19 nineteen<br>
20 twenty，30 thirty，40 <b>forty</b>（没有 u），50 fifty，60 sixty，70 seventy，80 eighty，90 ninety<br>
21 twenty-one（中间加短横线），100 one hundred，1,000 one thousand，1,000,000 one million<br>
💡 125 = one hundred <b>and</b> twenty-five</p>
<h3>② 序数词（第一、第二）</h3>
<p>第1 <b>first</b>，第2 <b>second</b>，第3 <b>third</b>（这三个特殊）<br>
其他一般加 th：fourth 第4，sixth 第6，seventh 第7，tenth 第10<br>
特殊变化：fifth 第5，eighth 第8，ninth 第9，twelfth 第12，twentieth 第20<br>
⭐ 序数词前一般加 the：the first day</p>
<h3>③ 时间</h3>
<p>8:00 eight o'clock；8:30 eight thirty / half past eight；8:15 eight fifteen / a quarter past eight<br>
问时间：What time is it? → It's eight o'clock.</p>
<h3>④ 时间介词 in / on / at</h3>
<p><b>at</b> + 具体钟点：at 7 o'clock，at noon<br>
<b>on</b> + 具体某一天：on Monday，on May 1st，on my birthday<br>
<b>in</b> + 较长时间（月、年、季节、上午下午）：in May，in 2026，in summer，in the morning</p>
</div>
<ex en="I have two brothers." zh="我有两个哥哥。"/>
<ex en="This is my first time in Beijing." zh="这是我第一次来北京。"/>
<ex en="What time is it? It's half past seven." zh="几点了？七点半。"/>
<ex en="My birthday is on May the fifth." zh="我的生日是五月五日。"/>
<ex en="I get up at six in the morning." zh="我早上六点起床。"/>
<quiz q="40 的英文是？" opts="fourty|forty" ans="1" why="40 是 forty，没有 u（但 14 是 fourteen）。" en="forty"/>
<quiz q="I was born ___ 1998." opts="at|on|in" ans="2" why="年份前用 in。" en="I was born in 1998."/>
<quiz q="We have class ___ Monday." opts="at|on|in" ans="1" why="星期几前面用 on。" en="We have class on Monday."/>
`});

;
LESSONS.push({id:'prep', part:'第1部分 认识单词', title:'11. 介词：在哪里', body:`
<p>介词是表示「位置、方向、方式」的小词。介词后面要跟<b>名词或代词宾格</b>：with <b>me</b>（不说 with I）。</p>
<div class="note">
<h3>① 位置介词</h3>
<table>
<tr><th>介词</th><th>意思</th><th>例子</th></tr>
<tr><td>in</td><td>在…里面</td><td>in the box 在盒子里</td></tr>
<tr><td>on</td><td>在…上面（贴着）</td><td>on the desk 在桌子上</td></tr>
<tr><td>under</td><td>在…下面</td><td>under the bed 在床下</td></tr>
<tr><td>next to / beside</td><td>在…旁边</td><td>next to the door 在门旁边</td></tr>
<tr><td>behind</td><td>在…后面</td><td>behind the tree 在树后</td></tr>
<tr><td>in front of</td><td>在…前面</td><td>in front of the house 在房子前面</td></tr>
<tr><td>between A and B</td><td>在 A 和 B 之间</td><td>between you and me</td></tr>
<tr><td>above / over</td><td>在…上方（不贴着）</td><td>above the table</td></tr>
</table>
<h3>② 地点里的 in 和 at</h3>
<p><b>at</b> + 小地点、某个点：at home 在家，at school 在学校，at the bus stop 在车站<br>
<b>in</b> + 大地方：in China 在中国，in Shanghai 在上海</p>
<h3>③ 方向和其他</h3>
<p>to 去往：go <b>to</b> school；from 从：<b>from</b> China<br>
into 进入：walk <b>into</b> the room；out of 从…出来<br>
with 和/用：<b>with</b> my friend；by 乘坐/通过：<b>by</b> bus，<b>by</b> train（但：on foot 步行）<br>
for 为了/给：a gift <b>for</b> you；about 关于：a book <b>about</b> animals</p>
<p>⚠️ <b>home</b> 前一般不加 to：go home（回家），不说 go to home。</p>
</div>
<ex en="The cat is under the table." zh="猫在桌子底下。"/>
<ex en="My phone is on the bed." zh="我的手机在床上。"/>
<ex en="I live in Guangzhou." zh="我住在广州。"/>
<ex en="She goes to work by bus." zh="她坐公交车上班。"/>
<ex en="Can you come with me?" zh="你能和我一起来吗？" tip="with 后面用宾格 me"/>
<quiz q="The book is ___ the desk.（书在桌子上）" opts="in|on|under" ans="1" why="在表面上用 on。" en="The book is on the desk."/>
<quiz q="I go to school ___ foot.（步行）" opts="by|on|in" ans="1" why="步行是固定说法 on foot。" en="I go to school on foot."/>
<quiz q="哪句对？" opts="Let's go to home.|Let's go home." ans="1" why="home 前不加 to。" en="Let's go home."/>
`});

LESSONS.push({id:'conj', part:'第1部分 认识单词', title:'12. 连词：把句子连起来', body:`
<div class="note">
<h3>① 并列连词（左右两边地位一样）</h3>
<table>
<tr><th>连词</th><th>意思</th><th>例子</th></tr>
<tr><td>and</td><td>和、而且</td><td>you and me</td></tr>
<tr><td>but</td><td>但是</td><td>small but nice</td></tr>
<tr><td>or</td><td>或者；（否定句里）也不</td><td>tea or coffee</td></tr>
<tr><td>so</td><td>所以</td><td>I was tired, so I slept.</td></tr>
</table>
<h3>② 从属连词（连接一个「主句」和一个「从句」）</h3>
<table>
<tr><th>连词</th><th>意思</th></tr>
<tr><td>because</td><td>因为</td></tr>
<tr><td>if</td><td>如果</td></tr>
<tr><td>when</td><td>当…的时候</td></tr>
<tr><td>before / after</td><td>在…之前 / 之后</td></tr>
<tr><td>although / though</td><td>虽然</td></tr>
<tr><td>until</td><td>直到</td></tr>
</table>
<p>⚠️ <b>中英文大不同</b>：中文说「因为…所以…」「虽然…但是…」，英语<b>只能用一个</b>！<br>
❌ Because it rained, so I stayed home.<br>
✅ Because it rained, I stayed home. 或 ✅ It rained, so I stayed home.<br>
❌ Although he is rich, but he is not happy.<br>
✅ Although he is rich, he is not happy.</p>
</div>
<ex en="I like tea and coffee." zh="我喜欢茶和咖啡。"/>
<ex en="The room is small but clean." zh="房间很小但很干净。"/>
<ex en="Do you want tea or coffee?" zh="你想要茶还是咖啡？"/>
<ex en="I didn't go out because it was raining." zh="我没出去，因为在下雨。"/>
<ex en="Although she is young, she is very wise." zh="虽然她很年轻，但她很有智慧。" tip="有 although 就不能再加 but"/>
<quiz q="It was late, ___ I went to bed." opts="because|so|but" ans="1" why="前面是原因，后面是结果，用 so（所以）。" en="It was late, so I went to bed."/>
<quiz q="哪句对？" opts="Because I was sick, so I didn't go.|Because I was sick, I didn't go." ans="1" why="because 和 so 不能同时用。" en="Because I was sick, I didn't go."/>
`});

LESSONS.push({id:'neg', part:'第2部分 基本句子', title:'13. 否定句：「不」怎么说', body:`
<p>英语说「不」，要看句子里是什么动词。</p>
<div class="note">
<h3>情况1：有 be 动词（am/is/are/was/were）→ 在后面加 not</h3>
<p>I am happy. → I am <b>not</b> happy.<br>
They were here. → They were <b>not</b> (weren't) here.</p>
<h3>情况2：有情态动词（can/will/should/must…）→ 在后面加 not</h3>
<p>I can swim. → I <b>cannot</b> (can't) swim.<br>
He will come. → He will not (<b>won't</b>) come.</p>
<h3>情况3：只有实义动词 → 请「助手」do / does / did 来帮忙</h3>
<table>
<tr><th>情况</th><th>加什么</th><th>例子</th></tr>
<tr><td>现在，主语不是三单</td><td>don't + 动词原形</td><td>I <b>don't</b> like it.</td></tr>
<tr><td>现在，主语是三单</td><td>doesn't + 动词原形</td><td>He <b>doesn't</b> like it.</td></tr>
<tr><td>过去（所有人）</td><td>didn't + 动词原形</td><td>She <b>didn't</b> go.</td></tr>
</table>
<p>⭐ 关键：用了 doesn't / didn't 后，<b>动词要变回原形</b>！<br>
He likes it. → He doesn't <b>like</b> it.（❌ doesn't likes）<br>
She went. → She didn't <b>go</b>.（❌ didn't went）</p>
<h3>缩写对照</h3>
<p>is not = isn't，are not = aren't，was not = wasn't，were not = weren't，do not = don't，does not = doesn't，did not = didn't，can not = can't，will not = won't</p>
</div>
<ex en="I am not hungry." zh="我不饿。"/>
<ex en="I don't know." zh="我不知道。"/>
<ex en="She doesn't eat meat." zh="她不吃肉。" tip="三单用 doesn't，后面 eat 用原形"/>
<ex en="We didn't watch the movie." zh="我们没看那部电影。"/>
<ex en="He can't drive." zh="他不会开车。"/>
<quiz q="Tom ___ like fish." opts="don't|doesn't|isn't" ans="1" why="Tom 是三单，实义动词 like 用 doesn't。" en="Tom doesn't like fish."/>
<quiz q="I didn't ___ him yesterday." opts="see|saw|seeing" ans="0" why="didn't 后面用动词原形。" en="I didn't see him yesterday."/>
<quiz q="「她不是老师」怎么说？" opts="She doesn't a teacher.|She isn't a teacher." ans="1" why="句子里有 be 动词 is，直接加 not。" en="She isn't a teacher."/>
`});

LESSONS.push({id:'ynq', part:'第2部分 基本句子', title:'14. 一般疑问句：回答 Yes / No', body:`
<p>一般疑问句就是可以用「是 / 不是」回答的问题。规则和否定句几乎一样。</p>
<div class="note">
<h3>情况1：有 be 动词 → 把 be 挪到最前面</h3>
<p>You are a student. → <b>Are</b> you a student?<br>
回答：Yes, I am. / No, I'm not.</p>
<h3>情况2：有情态动词 → 把它挪到最前面</h3>
<p>She can swim. → <b>Can</b> she swim?<br>
回答：Yes, she can. / No, she can't.</p>
<h3>情况3：只有实义动词 → 句首加 Do / Does / Did，动词变原形</h3>
<p>You like it. → <b>Do</b> you like it?<br>
He likes it. → <b>Does</b> he <b>like</b> it?<br>
They went. → <b>Did</b> they <b>go</b>?<br>
回答：Yes, he does. / No, he doesn't.</p>
<p>⭐ 句尾用问号 ?，读的时候<b>句尾语调往上扬 ↗</b>。<br>
⭐ 第一人称和第二人称要对换：问 you，答 I。</p>
<h3>选择疑问句：…还是…？</h3>
<p>Do you like tea <b>or</b> coffee? → I like tea.（不能用 yes / no 回答）</p>
</div>
<ex en="Are you OK? Yes, I am." zh="你还好吗？是的，我还好。"/>
<ex en="Is this your bag? No, it isn't." zh="这是你的包吗？不，不是。"/>
<ex en="Do you speak English? Yes, a little." zh="你会说英语吗？会一点。"/>
<ex en="Does she live here? No, she doesn't." zh="她住在这里吗？不，她不住这。"/>
<ex en="Did you have breakfast?" zh="你吃早饭了吗？"/>
<ex en="Can you help me?" zh="你能帮我吗？"/>
<quiz q="___ he your brother?" opts="Do|Does|Is" ans="2" why="句子没有实义动词，是「他是…吗」，用 be 动词 Is。" en="Is he your brother?"/>
<quiz q="___ your mother work in a hospital?" opts="Do|Does|Is" ans="1" why="your mother 是三单，有实义动词 work，用 Does。" en="Does your mother work in a hospital?"/>
<quiz q="Did you ___ my message?" opts="get|got|gets" ans="0" why="Did 后面用动词原形。" en="Did you get my message?"/>
`});

;
LESSONS.push({id:'whq', part:'第2部分 基本句子', title:'15. 特殊疑问句：谁、什么、哪里', body:`
<p>特殊疑问句不能用 yes/no 回答，要回答具体信息。</p>
<div class="note">
<h3>① 疑问词表</h3>
<table>
<tr><th>疑问词</th><th>问什么</th><th>疑问词</th><th>问什么</th></tr>
<tr><td>what</td><td>什么</td><td>how</td><td>怎么样、如何</td></tr>
<tr><td>who</td><td>谁</td><td>how old</td><td>几岁</td></tr>
<tr><td>whose</td><td>谁的</td><td>how many</td><td>多少（可数）</td></tr>
<tr><td>where</td><td>哪里</td><td>how much</td><td>多少（不可数）/ 多少钱</td></tr>
<tr><td>when</td><td>什么时候</td><td>how long</td><td>多久 / 多长</td></tr>
<tr><td>why</td><td>为什么</td><td>how often</td><td>多久一次</td></tr>
<tr><td>which</td><td>哪一个</td><td>what time</td><td>几点</td></tr>
</table>
<h3>② 万能公式：疑问词 + 一般疑问句？</h3>
<p>第1步，先写一般疑问句：Do you live in Beijing?<br>
第2步，把要问的部分（in Beijing）去掉，换成疑问词放最前面：<br>
<b>Where</b> do you live?</p>
<p>更多：<br>
<b>What</b> is your name?（你叫什么名字？）<br>
<b>Why</b> are you late?（你为什么迟到？）<br>
<b>When</b> did she leave?（她什么时候走的？）</p>
<h3>③ 例外：问「谁 / 什么」做主语时，直接替换，不加 do</h3>
<p>Tom broke the window. → <b>Who</b> broke the window?（谁打破了窗户？）</p>
<p>⭐ 特殊疑问句句尾语调一般<b>往下降 ↘</b>。</p>
</div>
<ex en="What is your name? My name is Li Ming." zh="你叫什么名字？我叫李明。"/>
<ex en="Where do you live?" zh="你住在哪里？"/>
<ex en="How old are you? I'm twenty-five." zh="你多大了？我二十五岁。"/>
<ex en="How much is this shirt?" zh="这件衬衫多少钱？"/>
<ex en="Why are you so happy today?" zh="你今天为什么这么开心？"/>
<ex en="Who is that man?" zh="那个男人是谁？"/>
<ex en="How many people are there in your family?" zh="你家有几口人？"/>
<quiz q="___ is your birthday? It's in June." opts="Where|When|Who" ans="1" why="回答的是时间，用 When。" en="When is your birthday?"/>
<quiz q="___ apples do you want?" opts="How many|How much" ans="0" why="apples 可数，用 How many。" en="How many apples do you want?"/>
<quiz q="Where ___ he work?" opts="do|does|is" ans="1" why="he 三单，有实义动词 work，用 does。" en="Where does he work?"/>
`});

LESSONS.push({id:'imper', part:'第2部分 基本句子', title:'16. 祈使句：让别人做事', body:`
<p>祈使句就是「命令、请求、建议」别人做事。特点：<b>没有主语，直接用动词原形开头</b>。</p>
<div class="note">
<h3>① 肯定：动词原形 + …</h3>
<p><b>Open</b> the door.（开门。）<br>
<b>Be</b> quiet.（安静。）<br>
加 please 更礼貌：<b>Please</b> sit down. / Sit down, <b>please</b>.</p>
<h3>② 否定：Don't + 动词原形 + …</h3>
<p><b>Don't</b> run.（别跑。）<br>
<b>Don't be</b> late.（别迟到。）<br>
也可以用 No + 名词/动词-ing：No smoking.（禁止吸烟。）</p>
<h3>③ 建议一起做：Let's + 动词原形</h3>
<p><b>Let's</b> go.（我们走吧。）<br>
Let's = Let us</p>
</div>
<ex en="Please come in." zh="请进。"/>
<ex en="Be careful!" zh="小心！"/>
<ex en="Don't worry." zh="别担心。"/>
<ex en="Don't be afraid." zh="别害怕。"/>
<ex en="Let's have lunch together." zh="我们一起吃午饭吧。"/>
<quiz q="___ quiet, please." opts="Is|Be|Are" ans="1" why="祈使句用动词原形，be 动词原形是 be。" en="Be quiet, please."/>
<quiz q="「别哭」怎么说？" opts="Not cry.|Don't cry.|No cry." ans="1" why="祈使句否定用 Don't + 动词原形。" en="Don't cry."/>
`});

LESSONS.push({id:'exclam', part:'第2部分 基本句子', title:'17. 感叹句：多么……啊！', body:`
<div class="note">
<h3>两个句型</h3>
<p>1. <b>What</b> + (a/an) + 形容词 + 名词 (+ 主语 + 谓语)!<br>
What <b>a beautiful day</b> (it is)!（多美好的一天啊！）<br>
What <b>nice people</b>!（多好的人啊！复数不用 a）</p>
<p>2. <b>How</b> + 形容词/副词 (+ 主语 + 谓语)!<br>
How <b>beautiful</b> (she is)!（她多美啊！）<br>
How <b>fast</b> he runs!（他跑得多快啊！）</p>
<p>⭐ 判断方法：看感叹的核心是不是<b>名词</b>。有名词 → What；没名词，只有形容词/副词 → How。</p>
</div>
<ex en="What a beautiful day!" zh="多美好的一天啊！"/>
<ex en="How cute the baby is!" zh="这宝宝多可爱啊！"/>
<ex en="What a good idea!" zh="真是个好主意！"/>
<ex en="How time flies!" zh="时间过得真快啊！"/>
<quiz q="___ a big house!" opts="What|How" ans="0" why="后面有名词 house，用 What。" en="What a big house!"/>
<quiz q="___ hot it is today!" opts="What|How" ans="1" why="hot 是形容词，后面没有名词，用 How。" en="How hot it is today!"/>
`});

LESSONS.push({id:'there', part:'第2部分 基本句子', title:'18. There be：某地「有」某物', body:`
<p>中文说「桌子上有一本书」，英语要用 <b>There is / There are</b>。</p>
<div class="note">
<h3>① 句型：There + be + 东西 + 地点</h3>
<p>东西是<b>单数或不可数</b> → There <b>is</b><br>
东西是<b>复数</b> → There <b>are</b><br>
过去：There <b>was</b> / There <b>were</b>；将来：There <b>will be</b></p>
<h3>② 否定和疑问</h3>
<p>否定：There <b>isn't</b> any milk.<br>
疑问：<b>Is there</b> a bank near here? → Yes, there is. / No, there isn't.<br>
问多少：<b>How many</b> students <b>are there</b>?</p>
<h3>③ 就近原则</h3>
<p>有好几个东西时，be 跟<b>离它最近</b>的那个一致：<br>
There <b>is</b> a pen and two books.（离 is 最近的是 a pen）<br>
There <b>are</b> two books and a pen.</p>
<h3>④ have 和 there be 的区别</h3>
<p><b>have</b>：某人拥有：I have a car.（我有一辆车）<br>
<b>there be</b>：某地存在：There is a car in front of the house.（房子前有一辆车）</p>
</div>
<ex en="There is a cat on the sofa." zh="沙发上有一只猫。"/>
<ex en="There are many people in the park." zh="公园里有很多人。"/>
<ex en="Is there a hospital near here?" zh="这附近有医院吗？"/>
<ex en="There isn't any water in the bottle." zh="瓶子里没有水。"/>
<ex en="There was a big tree here ten years ago." zh="十年前这里有一棵大树。"/>
<quiz q="There ___ three apples on the table." opts="is|are" ans="1" why="three apples 是复数。" en="There are three apples on the table."/>
<quiz q="There ___ some milk in the fridge." opts="is|are" ans="0" why="milk 不可数，当单数，用 is。" en="There is some milk in the fridge."/>
<quiz q="「教室里有一个老师」怎么说？" opts="The classroom has a teacher.|There is a teacher in the classroom." ans="1" why="某地有某物，用 there be。" en="There is a teacher in the classroom."/>
`});

;
LESSONS.push({id:'tense', part:'第3部分 时态（动词的时间）', title:'19. 时态是什么？', body:`
<p>中文表示时间，靠加词：「我<b>昨天</b>吃了」「我<b>正在</b>吃」「我<b>明天</b>吃」，「吃」字本身不变。<br>
英语不一样：<b>动词本身要变样子</b>。这种变化就叫<b>时态</b>。</p>
<div class="note">
<h3>英语最常用的 8 个时态（以 eat 吃为例）</h3>
<table>
<tr><th>时态</th><th>什么时候用</th><th>结构</th><th>例子</th></tr>
<tr><td>一般现在时</td><td>习惯、事实</td><td>动词原形 / 三单+s</td><td>I eat rice.</td></tr>
<tr><td>现在进行时</td><td>现在正在做</td><td>am/is/are + 动词-ing</td><td>I am eating.</td></tr>
<tr><td>一般过去时</td><td>过去做过</td><td>动词过去式</td><td>I ate rice.</td></tr>
<tr><td>过去进行时</td><td>过去某时正在做</td><td>was/were + 动词-ing</td><td>I was eating.</td></tr>
<tr><td>一般将来时</td><td>将来要做</td><td>will + 原形 / be going to + 原形</td><td>I will eat.</td></tr>
<tr><td>现在完成时</td><td>已经做了（对现在有影响）</td><td>have/has + 过去分词</td><td>I have eaten.</td></tr>
<tr><td>过去完成时</td><td>过去的过去</td><td>had + 过去分词</td><td>I had eaten.</td></tr>
<tr><td>现在完成进行时</td><td>从过去一直做到现在，还在做</td><td>have/has been + 动词-ing</td><td>I have been eating.</td></tr>
</table>
<p>💡 先把前 5 个学熟，日常交流就够用了。后面 3 个慢慢来。</p>
</div>
<ex en="I eat breakfast every day." zh="我每天吃早饭。" tip="一般现在时"/>
<ex en="I am eating breakfast now." zh="我现在正在吃早饭。" tip="现在进行时"/>
<ex en="I ate breakfast at seven." zh="我七点吃了早饭。" tip="一般过去时"/>
<ex en="I will eat breakfast tomorrow." zh="我明天会吃早饭。" tip="一般将来时"/>
<ex en="I have already eaten breakfast." zh="我已经吃过早饭了。" tip="现在完成时"/>
`});

LESSONS.push({id:'pres', part:'第3部分 时态（动词的时间）', title:'20. 一般现在时', body:`
<div class="note">
<h3>① 什么时候用</h3>
<p>1. <b>经常、习惯</b>做的事：I get up at 7 every day.<br>
2. <b>永远不变的事实</b>：The sun rises in the east.（太阳从东方升起）<br>
3. 现在的状态、喜好：I like music. / She lives in Shenzhen.<br>
4. 时刻表（火车、航班）：The train leaves at 8.</p>
<h3>② 结构</h3>
<p>肯定：主语 + 动词原形（<b>三单加 s/es</b>）<br>
否定：主语 + don't / doesn't + 动词原形<br>
疑问：Do / Does + 主语 + 动词原形？</p>
<h3>③ 信号词（看到就想到一般现在时）</h3>
<p>every day / every week 每天/每周，always，usually，often，sometimes，never，on Sundays 每个周日，once a week 一周一次</p>
<h3>④ 三单 -s 的读音</h3>
<p>在清辅音 p, t, k, f 后读 /s/：stops, likes<br>
在 s, x, ch, sh 后读 /ɪz/：watches, washes<br>
其他读 /z/：plays, goes</p>
</div>
<ex en="I go to work every day." zh="我每天去上班。"/>
<ex en="She usually takes the subway." zh="她通常坐地铁。"/>
<ex en="Water boils at one hundred degrees." zh="水在一百度沸腾。" tip="科学事实，用一般现在时"/>
<ex en="My father doesn't drink coffee." zh="我爸爸不喝咖啡。"/>
<ex en="Does your company ship goods to Oman?" zh="你们公司往阿曼发货吗？"/>
<ex en="How often do you exercise?" zh="你多久锻炼一次？"/>
<quiz q="He ___ TV every evening." opts="watch|watches|watching" ans="1" why="三单 + every evening，用 watches。" en="He watches TV every evening."/>
<quiz q="___ they live in Shanghai?" opts="Do|Does|Are" ans="0" why="they 不是三单，实义动词用 Do。" en="Do they live in Shanghai?"/>
`});

LESSONS.push({id:'prog', part:'第3部分 时态（动词的时间）', title:'21. 现在进行时', body:`
<div class="note">
<h3>① 什么时候用</h3>
<p>1. <b>说话这一刻正在做</b>：I am reading now.<br>
2. 这段时间正在做（不一定是这一秒）：I am learning English this year.<br>
3. 已经安排好的近期计划：I'm leaving tomorrow.（我明天走）</p>
<h3>② 结构：am / is / are + 动词-ing</h3>
<p>⚠️ be 动词不能少！❌ I reading. ✅ I am reading.<br>
否定：I am <b>not</b> reading.<br>
疑问：<b>Are</b> you reading?</p>
<h3>③ 动词加 -ing 的规则</h3>
<table>
<tr><th>规则</th><th>例子</th></tr>
<tr><td>一般直接加 ing</td><td>read → reading，play → playing</td></tr>
<tr><td>不发音的 e 结尾，去 e 加 ing</td><td>make → making，write → writing，come → coming</td></tr>
<tr><td>重读闭音节，双写尾字母加 ing</td><td>run → running，swim → swimming，sit → sitting，stop → stopping</td></tr>
<tr><td>ie 结尾，变 ie 为 y 加 ing</td><td>lie → lying，die → dying</td></tr>
</table>
<h3>④ 信号词</h3>
<p>now 现在，right now 此刻，Look! 看！，Listen! 听！，at the moment 此刻</p>
<h3>⑤ 不用进行时的动词（表示状态，不是动作）</h3>
<p>like，love，hate，want，need，know，understand，believe，have（拥有）<br>
❌ I am knowing him. ✅ I know him.</p>
</div>
<ex en="What are you doing? I'm cooking." zh="你在做什么？我在做饭。"/>
<ex en="Look! The children are swimming." zh="看！孩子们在游泳。" tip="swim 双写 m 加 ing"/>
<ex en="She is talking on the phone right now." zh="她现在正在打电话。"/>
<ex en="It's raining outside." zh="外面在下雨。"/>
<ex en="I'm not working today." zh="我今天不上班。"/>
<quiz q="Listen! Someone ___ at the door." opts="knock|knocks|is knocking" ans="2" why="Listen! 说明是此刻正在发生，用现在进行时。" en="Listen! Someone is knocking at the door."/>
<quiz q="write 的 -ing 形式是？" opts="writeing|writing|writting" ans="1" why="不发音的 e 结尾，去 e 加 ing。" en="writing"/>
<quiz q="哪句对？" opts="I am wanting a coffee.|I want a coffee." ans="1" why="want 是状态动词，不用进行时。" en="I want a coffee."/>
`});

LESSONS.push({id:'past', part:'第3部分 时态（动词的时间）', title:'22. 一般过去时', body:`
<div class="note">
<h3>① 什么时候用</h3>
<p>过去某个时间发生的事，<b>已经结束了</b>。</p>
<h3>② 结构</h3>
<p>be 动词：am / is → <b>was</b>，are → <b>were</b><br>
实义动词：变成<b>过去式</b>（所有人称都一样，不用管三单）<br>
否定：<b>didn't</b> + 动词原形<br>
疑问：<b>Did</b> + 主语 + 动词原形？</p>
<h3>③ 规则动词加 -ed</h3>
<table>
<tr><th>规则</th><th>例子</th></tr>
<tr><td>一般加 ed</td><td>work → worked，play → played</td></tr>
<tr><td>e 结尾加 d</td><td>like → liked，live → lived</td></tr>
<tr><td>辅音 + y，变 y 为 i 加 ed</td><td>study → studied，cry → cried</td></tr>
<tr><td>重读闭音节，双写尾字母加 ed</td><td>stop → stopped，plan → planned</td></tr>
</table>
<p>-ed 读音：t / d 后读 /ɪd/（wanted），清辅音后读 /t/（worked），其他读 /d/（played）</p>
<h3>④ 信号词</h3>
<p>yesterday 昨天，last night / week / year 昨晚/上周/去年，… ago …以前（two days ago 两天前），in 2020，just now 刚才</p>
<p>⭐ 不规则动词（went, ate, saw…）请看第 30 课「不规则动词表」。</p>
</div>
<ex en="I watched a movie last night." zh="我昨晚看了一部电影。"/>
<ex en="She was sick yesterday." zh="她昨天生病了。"/>
<ex en="We went to Beijing two years ago." zh="我们两年前去了北京。" tip="go 的过去式是 went"/>
<ex en="I didn't sleep well last night." zh="我昨晚没睡好。"/>
<ex en="Did you call the customer yesterday?" zh="你昨天给客户打电话了吗？"/>
<ex en="Where were you last weekend?" zh="你上周末在哪？"/>
<quiz q="I ___ at home yesterday." opts="am|was|were" ans="1" why="yesterday 说明是过去；I 的过去式 be 是 was。" en="I was at home yesterday."/>
<quiz q="study 的过去式是？" opts="studyed|studied|studed" ans="1" why="辅音 d + y，变 y 为 i 加 ed。" en="studied"/>
<quiz q="She didn't ___ the email." opts="send|sent|sends" ans="0" why="didn't 后面用原形。" en="She didn't send the email."/>
`});

LESSONS.push({id:'pastprog', part:'第3部分 时态（动词的时间）', title:'23. 过去进行时', body:`
<div class="note">
<h3>① 什么时候用</h3>
<p>过去<b>某一时刻正在做</b>的事。<br>
常和一般过去时搭配：一个「长动作」正在进行时，一个「短动作」突然发生。</p>
<h3>② 结构：was / were + 动词-ing</h3>
<p>I / he / she / it → <b>was</b> doing<br>
you / we / they → <b>were</b> doing</p>
<h3>③ 经典搭配</h3>
<p>长动作用过去进行时，短动作用一般过去时：<br>
I <b>was sleeping</b> when the phone <b>rang</b>.（我正在睡觉时，电话响了。）<br>
<b>When</b> + 短动作（一般过去时）；<b>While</b> + 长动作（过去进行时）</p>
<h3>④ 信号词</h3>
<p>at 8 last night 昨晚 8 点，at that time 那时，this time yesterday 昨天这个时候，when…，while…</p>
</div>
<ex en="I was having dinner at seven last night." zh="昨晚七点我正在吃晚饭。"/>
<ex en="What were you doing at that time?" zh="那时你在做什么？"/>
<ex en="She was cooking when I came home." zh="我回家的时候她正在做饭。"/>
<ex en="While I was walking, it started to rain." zh="我正在走路的时候，开始下雨了。"/>
<quiz q="They ___ TV when I called them." opts="watched|were watching|are watching" ans="1" why="我打电话（短动作）时，他们正在看电视（长动作），用过去进行时。" en="They were watching TV when I called them."/>
<quiz q="At nine last night, I ___ a book." opts="was reading|read|am reading" ans="0" why="过去某一时刻正在做，用过去进行时。" en="At nine last night, I was reading a book."/>
`});

;
LESSONS.push({id:'future', part:'第3部分 时态（动词的时间）', title:'24. 一般将来时', body:`
<div class="note">
<h3>① 两种结构</h3>
<p>1. <b>will + 动词原形</b>（所有人称都一样）<br>
用在：临时决定、预测、承诺。<br>
I will help you.（我会帮你。）I'll = I will，won't = will not</p>
<p>2. <b>be going to + 动词原形</b><br>
用在：<b>早就打算好</b>的计划、有迹象马上要发生的事。<br>
I am going to visit my aunt this weekend.（我打算这周末去看阿姨。）<br>
Look at the clouds. It's going to rain.（看那些云，要下雨了。）</p>
<h3>② 否定和疑问</h3>
<p>will：I won't go. / Will you go?<br>
be going to：I'm not going to go. / Are you going to go?</p>
<h3>③ 信号词</h3>
<p>tomorrow 明天，next week / month / year 下周/下个月/明年，in the future 将来，soon 很快，in two days 两天后，tonight 今晚</p>
<h3>④ 其他表示将来的方法</h3>
<p>现在进行时（安排好的）：I'm meeting him tomorrow.<br>
一般现在时（时刻表）：The flight leaves at 9 a.m.</p>
</div>
<ex en="I will call you tomorrow." zh="我明天给你打电话。"/>
<ex en="It will be sunny tomorrow." zh="明天会是晴天。"/>
<ex en="I'm going to learn English this year." zh="我今年打算学英语。"/>
<ex en="Will you come to the party?" zh="你会来派对吗？"/>
<ex en="Don't worry, I won't tell anyone." zh="别担心，我不会告诉任何人。"/>
<ex en="The shipment will arrive next Monday." zh="这批货下周一会到。"/>
<quiz q="She will ___ us next week." opts="visit|visits|visited" ans="0" why="will 后面永远用原形。" en="She will visit us next week."/>
<quiz q="We ___ going to have a meeting." opts="is|are|will" ans="1" why="be going to 里的 be 要跟主语 we 一致，用 are。" en="We are going to have a meeting."/>
`});

LESSONS.push({id:'perfect', part:'第3部分 时态（动词的时间）', title:'25. 现在完成时', body:`
<p>这是中国人觉得最难的时态，但其实意思很简单：<b>过去发生的事，和现在有关系</b>。</p>
<div class="note">
<h3>① 结构：have / has + 过去分词</h3>
<p>I / you / we / they → <b>have</b> done（缩写 I've）<br>
he / she / it → <b>has</b> done（缩写 he's）<br>
否定：haven't / hasn't done<br>
疑问：Have you done…? / Has he done…?</p>
<h3>② 三种用法</h3>
<p>1. <b>已经做完，影响到现在</b>：I have lost my key.（我把钥匙丢了 → 现在进不了门）<br>
2. <b>经历</b>（曾经…过）：I have been to Japan.（我去过日本）<br>
3. <b>从过去一直持续到现在</b>：I have lived here for 5 years.（我在这住了 5 年了，现在还住）</p>
<h3>③ 信号词</h3>
<p>already 已经（肯定句），yet 还 / 已经（否定句、疑问句，放句尾），just 刚刚，ever 曾经，never 从未，before 以前，so far 到目前为止，recently 最近<br>
<b>for</b> + 一段时间：for three years（三年了）<br>
<b>since</b> + 起点：since 2020（自从 2020 年）</p>
<h3>④ 和一般过去时的区别</h3>
<p>一般过去时：只说过去，<b>有具体过去时间</b>：I lost my key <b>yesterday</b>.<br>
现在完成时：强调对现在的影响，<b>不能跟具体过去时间</b>：❌ I have lost my key yesterday.</p>
<h3>⑤ have been to 和 have gone to</h3>
<p>He <b>has been to</b> Paris.（他去过巴黎，已经回来了）<br>
He <b>has gone to</b> Paris.（他去巴黎了，人现在不在这）</p>
</div>
<ex en="I have finished my homework." zh="我已经完成作业了。"/>
<ex en="Have you ever been to Dubai?" zh="你去过迪拜吗？"/>
<ex en="She has worked here for three years." zh="她在这里工作三年了。" tip="for + 一段时间"/>
<ex en="I have known him since 2018." zh="我从 2018 年就认识他了。" tip="since + 起点"/>
<ex en="Has the container arrived yet?" zh="集装箱到了吗？"/>
<ex en="I haven't received the payment yet." zh="我还没收到付款。"/>
<quiz q="She ___ already left." opts="have|has|is" ans="1" why="she 用 has + 过去分词。" en="She has already left."/>
<quiz q="I have lived here ___ 2015." opts="for|since" ans="1" why="2015 是一个起点，用 since。" en="I have lived here since 2015."/>
<quiz q="哪句对？" opts="I have seen him yesterday.|I saw him yesterday." ans="1" why="有具体过去时间 yesterday，用一般过去时。" en="I saw him yesterday."/>
`});

LESSONS.push({id:'pastperf', part:'第3部分 时态（动词的时间）', title:'26. 过去完成时', body:`
<div class="note">
<h3>① 什么时候用：过去的过去</h3>
<p>两件事都发生在过去，<b>更早的那件</b>用过去完成时。</p>
<h3>② 结构：had + 过去分词（所有人称都一样）</h3>
<p>When I got to the station, the train <b>had left</b>.<br>
（我到车站时，火车已经开走了。→ 火车先走，我后到）</p>
<p>时间轴：<br>
—— [火车开走 had left] —— [我到站 got] —— [现在] ——&gt;</p>
<h3>③ 信号词</h3>
<p>by + 过去时间（by last year 到去年为止），before，after，when，already</p>
</div>
<ex en="When I arrived, the meeting had started." zh="我到的时候，会议已经开始了。"/>
<ex en="She had never seen the sea before that trip." zh="那次旅行之前她从没见过大海。"/>
<ex en="By the time he called, I had gone to bed." zh="他打电话来的时候，我已经睡了。"/>
<quiz q="I realized I ___ my phone at home." opts="leave|had left|have left" ans="1" why="「把手机落家里」比「意识到」更早，用过去完成时。" en="I realized I had left my phone at home."/>
`});

LESSONS.push({id:'perfprog', part:'第3部分 时态（动词的时间）', title:'27. 完成进行时和其他时态', body:`
<div class="note">
<h3>① 现在完成进行时：have / has been + 动词-ing</h3>
<p>从过去开始，<b>一直做到现在，而且还在做</b>，强调「一直在」。<br>
I <b>have been waiting</b> for two hours.（我已经等了两个小时了，还在等）</p>
<h3>② 将来进行时：will be + 动词-ing</h3>
<p>将来某一时刻正在做。<br>
This time tomorrow, I <b>will be flying</b> to Muscat.（明天这时候，我正在飞往马斯喀特）</p>
<h3>③ 将来完成时：will have + 过去分词</h3>
<p>到将来某时，已经完成。<br>
By next June, I <b>will have graduated</b>.（到明年六月，我就已经毕业了）</p>
<h3>④ 过去将来时：would + 动词原形 / was going to</h3>
<p>站在过去说「将要」，常用于转述。<br>
He said he <b>would</b> come.（他说过他会来）</p>
<h3>⑤ 所有时态总表（以 do 为例）</h3>
<table>
<tr><th></th><th>一般</th><th>进行</th><th>完成</th><th>完成进行</th></tr>
<tr><td>现在</td><td>do / does</td><td>am/is/are doing</td><td>have/has done</td><td>have/has been doing</td></tr>
<tr><td>过去</td><td>did</td><td>was/were doing</td><td>had done</td><td>had been doing</td></tr>
<tr><td>将来</td><td>will do</td><td>will be doing</td><td>will have done</td><td>will have been doing</td></tr>
<tr><td>过去将来</td><td>would do</td><td>would be doing</td><td>would have done</td><td>would have been doing</td></tr>
</table>
<p>💡 表里 16 个时态，日常最常用的是：一般现在、现在进行、一般过去、一般将来、现在完成。</p>
</div>
<ex en="I have been learning English for three months." zh="我学英语已经三个月了（还在学）。"/>
<ex en="It has been raining all day." zh="雨下了一整天了。"/>
<ex en="This time next week, I will be lying on the beach." zh="下周这个时候，我正躺在海滩上。"/>
<ex en="She said she would send the documents." zh="她说她会发送文件。"/>
<quiz q="He ___ for you since 9 o'clock.（一直在等）" opts="waits|has been waiting|waited" ans="1" why="从 9 点一直等到现在还在等，用现在完成进行时。" en="He has been waiting for you since 9 o'clock."/>
`});

;
LESSONS.push({id:'modal', part:'第4部分 动词进阶', title:'28. 情态动词：能、可以、必须', body:`
<p>情态动词放在动词前，表示说话人的态度：能、可以、应该、必须……</p>
<div class="note">
<h3>① 三条铁规则</h3>
<p>1. 后面跟<b>动词原形</b>：He can <b>swim</b>.（❌ can swims）<br>
2. <b>没有三单变化</b>：He can（❌ He cans）<br>
3. 否定直接加 not，疑问直接提前：can't / Can you…?</p>
<h3>② 常用情态动词表</h3>
<table>
<tr><th>词</th><th>意思</th><th>例子</th></tr>
<tr><td>can</td><td>能、会；可以</td><td>I can swim. / Can I sit here?</td></tr>
<tr><td>could</td><td>can 的过去式；更礼貌的请求</td><td>Could you help me?</td></tr>
<tr><td>may</td><td>可以（正式）；可能</td><td>May I come in? / It may rain.</td></tr>
<tr><td>might</td><td>也许（可能性更小）</td><td>He might be late.</td></tr>
<tr><td>must</td><td>必须（自己觉得）；一定是（推测）</td><td>I must go now. / She must be tired.</td></tr>
<tr><td>have to</td><td>不得不（客观要求，有人称变化）</td><td>She has to work on Sunday.</td></tr>
<tr><td>should</td><td>应该</td><td>You should see a doctor.</td></tr>
<tr><td>would</td><td>will 的过去式；礼貌请求</td><td>Would you like some tea?</td></tr>
<tr><td>shall</td><td>（用于 I / we 的提议）…好吗</td><td>Shall we go?</td></tr>
<tr><td>need</td><td>需要</td><td>You needn't worry.</td></tr>
</table>
<h3>③ 容易混的点</h3>
<p><b>mustn't</b> = 禁止（绝对不可以）：You mustn't smoke here.<br>
<b>don't have to / needn't</b> = 不必：You don't have to come.<br>
Must I…? 否定回答用 <b>No, you needn't / don't have to.</b></p>
<h3>④ 常用礼貌句型</h3>
<p>Would you like…? 你想要…吗？ → Yes, please. / No, thanks.<br>
I'd like… 我想要…（I'd = I would）</p>
</div>
<ex en="Can you speak English? Yes, I can." zh="你会说英语吗？是的，我会。"/>
<ex en="Could you please send me the price list?" zh="能请你把价格表发给我吗？"/>
<ex en="You should drink more water." zh="你应该多喝水。"/>
<ex en="I have to get up early tomorrow." zh="我明天不得不早起。"/>
<ex en="You mustn't park here." zh="你不能在这里停车。"/>
<ex en="Would you like a cup of coffee?" zh="你想来杯咖啡吗？"/>
<ex en="I'd like a glass of water, please." zh="请给我一杯水。"/>
<quiz q="She can ___ the piano." opts="play|plays|playing" ans="0" why="情态动词后用原形。" en="She can play the piano."/>
<quiz q="Must I finish it today? No, you ___." opts="mustn't|needn't" ans="1" why="must 问句的否定回答用 needn't（不必）。mustn't 是禁止。" en="No, you needn't."/>
<quiz q="He ___ work on Saturdays.（他周六不得不上班）" opts="have to|has to" ans="1" why="have to 有人称变化，he 用 has to。" en="He has to work on Saturdays."/>
`});

LESSONS.push({id:'passive', part:'第4部分 动词进阶', title:'29. 被动语态：「被」做', body:`
<p>主动：<b>我</b>打破了杯子。被动：杯子<b>被</b>（我）打破了。英语用被动更常见，特别是正式文件、商务邮件。</p>
<div class="note">
<h3>① 核心结构：be + 过去分词</h3>
<p>主动：Tom <b>cleans</b> the room.<br>
被动：The room <b>is cleaned</b> (by Tom).<br>
做法：① 宾语挪到前面做主语 ② 动词改成 be + 过去分词 ③ 原来的主语放 by 后面（可省略）</p>
<h3>② 各时态的被动（以 make 为例）</h3>
<table>
<tr><th>时态</th><th>被动结构</th><th>例子</th></tr>
<tr><td>一般现在</td><td>am/is/are + done</td><td>It is made in China.</td></tr>
<tr><td>一般过去</td><td>was/were + done</td><td>It was made in 2020.</td></tr>
<tr><td>一般将来</td><td>will be + done</td><td>It will be made soon.</td></tr>
<tr><td>现在进行</td><td>am/is/are being + done</td><td>It is being made now.</td></tr>
<tr><td>现在完成</td><td>have/has been + done</td><td>It has been made.</td></tr>
<tr><td>情态动词</td><td>can/must/should + be + done</td><td>It must be made today.</td></tr>
</table>
<h3>③ 什么时候用被动</h3>
<p>1. 不知道是谁做的：My bike was stolen.（我的车被偷了）<br>
2. 不重要是谁做的：English is spoken all over the world.<br>
3. 想强调「东西」：The goods were delivered yesterday.</p>
<p>⚠️ 中文常省略「被」，但英语该用被动就得用：「这本书写得很好」= The book <b>is written</b> well.</p>
</div>
<ex en="This phone is made in China." zh="这部手机是中国制造的。"/>
<ex en="The window was broken by the boy." zh="窗户被那个男孩打破了。"/>
<ex en="English is spoken in many countries." zh="很多国家都说英语。"/>
<ex en="The goods have been shipped." zh="货物已经发出了。"/>
<ex en="The package will be delivered tomorrow." zh="包裹明天会被送达。"/>
<ex en="Smoking is not allowed here." zh="这里不允许吸烟。"/>
<quiz q="The letter ___ yesterday." opts="sent|was sent|is sent" ans="1" why="信是「被」寄出，yesterday 是过去，用 was + 过去分词。" en="The letter was sent yesterday."/>
<quiz q="The room must ___ every day." opts="clean|be cleaned|cleaned" ans="1" why="情态动词的被动：must be + 过去分词。" en="The room must be cleaned every day."/>
`});

;

<p>大部分动词变过去式加 -ed 就行，但最常用的动词偏偏不规则，只能背。下面 64 个是最常用的，点 ▶ 可以听三个形式连读。</p>

<p>① <b>三个都一样（AAA）</b>：put-put-put，cut，let，hit，cost，read（写法一样，读音不同）<br>

③ <b>第一和第三一样（ABA）</b>：come-came-come，run-ran-run，become-became-become<br>
④ <b>三个都不同（ABC）</b>：go-went-gone，eat-ate-eaten，see-saw-seen，write-wrote-written</p>
