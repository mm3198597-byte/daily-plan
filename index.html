function buildDay(date) {
  const wk = weekOf(date), dow = (date.getDay() + 6) % 7, dn = dow + 1, key = ymd(date);
  const cls = ((WEEKS[wk] || {})[dn] || []).map(c => ({p: c[0], s: PERIOD[c[0]][0], e: PERIOD[c[0]][1], n: CN[c[1]], r: c[2]}));
  const sig = cls.map(c => c.p).join(',');
  const g = (GYM_MAP[GYM_WEEK[wk]] || {})[dn];
  const runMin = Math.max(15, (RUN_WEEK[wk] || 25) - (g === 'A' || g === 'D' ? 5 : 0));
  const L = [];
  const add = (s, e, c, t, d) => L.push({s, e, c, t, d: d || ''});
  const stage = STAGE[wk] || {};
  const biz = (BIZ[wk] || {})[dow];
  const exam = wk >= 15;

  const wake = (s, e) => add(s, e, 'wake', '起床，喝一杯温水', dow === 6 ? '空腹称体重，写进下面的"日志"。' : '');
  const run = (s, e, place, min) => add(s, e, 'run', '跑步 ' + (min || runMin) + ' 分钟（' + place + '）',
    '<ul>' + RUN_RULES.map(x => '<li>' + x + '</li>').join('') + '</ul>' + (g === 'A' || g === 'D' ? '<p class="tip">今天是臀腿日，已经少跑 5 分钟。</p>' : ''));
  const meal = (s, e, type) => {
    const m = {b: ['早餐', MEAL.b[dow]], lh: ['午餐（家里）', MEAL.lh[dow]], lc: ['午餐（食堂）', MEAL.lc[dow]],
      dh: ['晚餐（家里）', MEAL.dh[dow]], dc: ['晚餐（食堂）', MEAL.dc], sn: ['加餐', MEAL.snack[dow]], post: ['练后加餐', MEAL.post]}[type];
    add(s, e, 'meal', m[0], m[1] + (type === 'dh' && g ? '<br>' + MEAL.post : ''));
  };
  const klass = c => add(c.s, c.e, 'cls', c.n, c.r);
  const gym = (s, e) => g && add(s, e, 'gym', '健身房：' + WORKOUTS[g].name, gymDetail(g));
  const bizItem = (s, e, where) => biz ? add(s, e, 'biz', biz[0], (where ? '<p class="tip">' + where + '</p>' : '') + biz[1]) :
    add(s, e, 'biz', '业务：跟进本周任务', '把这周没做完的任务往前推一步，结果填进表格。本周目标见上方。');
  const biz2 = (s, e) => add(s, e, 'biz', '业务：跟进和整理', '回复工厂、清关行、店铺的消息；把今天拿到的数字填进供应商档案或成本表；有问题发到家庭群。');
  const eng = (s, e, where) => {
    const E = ENG[wk] || ENG[11], p = (wk === 11 && dow >= 3 && E[2]) ? E[2] : E[0];
    add(s, e, 'eng', '英语开口练习（4 步）' + (where ? '：' + where : ''),
      '<ol><li>复习句子本 5 分钟：大声读昨天记下的句子，每句 3 遍。</li>' +
      '<li>跟读 10 分钟：桌面《广交会采访话术（新版）》点 🔊，本周读' + E[1] + '。先慢速。</li>' +
      '<li>AI 语音对话 15～30 分钟（提示词 ' + p + '）：' + PROMPTS[p] + '<br>完整提示词在电脑桌面《开口练习计划》第 6 章，复制到手机备忘录里用。</li>' +
      '<li>记句子本 5 分钟：今天说不出来的、AI 纠正过的句子，写进下面"日志"。</li></ol>' +
      '<p class="tip">本周开口等级：' + (stage.level || '') + '。过关标准见《开口练习计划》第 3 章。</p>');
  };
  const words = (s, e, where) => {
    const wa = WDAY[key] || [], rv = isReview(key);
    if (!wa.length) return;
    add(s, e, 'word', (rv ? '单词：复习本周 ' + wa.length + ' 个' : '单词：新学 ' + wa.length + ' 个') + '（' + catCount(wa) + '）',
      (where ? '<p class="tip">' + where + '</p>' : '') +
      '<p class="tip">' + (rv ? '先把下面的小测验全部做完，错的词再看卡片，读 5 遍。' : '10 个一组：点 🔊 听 3 遍并跟读 → 点 ▶ 读例句 → 遮住中文说意思。三组做完再做小测验，错的回去重读。') + '</p>' +
      (rv ? wordQuiz(wa) + wa.map(wordCard).join('') : wa.map(wordCard).join('') + wordQuiz(wa)));
  };
  const wrev = (s, e) => {
    const r = revSet(key);
    if (r.length) add(s, e, 'wrev', '单词复习：前几天的 ' + r.length + ' 个', '<p class="tip">间隔复习：昨天和 3 天前学的词。做小测验，错的大声读 3 遍。</p>' + wordQuiz(r));
  };
  const wnight = (s, e) => {
    const wa = WDAY[key] || [];
    if (wa.length && !isReview(key)) add(s, e, 'wrev', '睡前自测：今天的 ' + wa.length + ' 个词', '<p class="tip">睡前再过一遍，第二天记得牢。只做题，不用看卡片。</p>' + wordQuiz(wa));
  };
  const gram = (s, e) => {
    const a = GRAM[key] || [];
    if (!a.length) return add(s, e, 'gram', '语法：复习本周的课', '打开"语法"页，把本周打了勾的课的小测验再做一遍，错的抄进笔记本。', true);
    add(s, e, 'gram', '语法：' + a.map(i => LESSONS[i].title).join('；'),
      a.map(i => '<button class="open" data-l="' + i + '">打开 ' + LESSONS[i].title + '</button>').join('') +
      '<p>读完课文，点 ▶ 听例句并跟读，做完小测验，抄"✍️ 抄到笔记本"那一框。</p>');
  };
  const ai = (s, e) => {
    const A = AI[wk];
    if (!A || dow > 4) return false;
    add(s, e, 'ai', 'AI 学习（本周主题：' + A[0] + '）', A[1][dow] + '<p class="tip">用你常用的 AI（豆包、Kimi、ChatGPT、Claude 等）。好用的提示词存进备忘录"提示词库"。</p>');
    return true;
  };
  const hl = (s, e) => {
    const h = dow === 0 ? HL_MON : dow === 2 ? HL_WED : dow === 4 ? HL_FRI[wk] : null;
    if (!h) return false;
    add(s, e, 'hl', '公司 / 华磊：' + h[0], h[1] + '<p class="tip">华磊里默认只看不改。要改数据，先问家人。</p>');
    return true;
  };
  const news = (s, e) => { const n = NEWS[dow]; add(s, e, 'news', '行业资讯 10 分钟：' + n[0], n[1]); };
  const school = (s, e) => {
    const t = cls.map(c => c.n).filter((v, i, a) => a.indexOf(v) === i);
    add(s, e, 'school', exam ? '期末复习' : '学业：作业和复习',
      exam ? '按 AI 做的复习提纲复习一门课，做 10 道自测题。期末日期出来后告诉 Claude，把考试周的任务再调轻。' :
        (t.length ? '整理今天 ' + t.join('、') + ' 的笔记，先做有截止日期的作业。' : '挑本周一门课做作业或课后题。毕业只要不挂科，但作业别拖到考试周。'));
  };
  const notes = (s, e) => add(s, e, 'school', '课后 15 分钟整理笔记', '趁刚下课，把老师强调的考点和作业要求记下来。');
  const read = (s, e, where) => { const r = READ[wk] || READ[11]; add(s, e, 'read', '阅读' + (where ? '（' + where + '）' : '') + '：' + r[0], r[1]); };
  const review = (s, e) => add(s, e, 'review', '今日复盘 10 分钟', '把今天的任务打勾；没做完的想一下原因，写进日志的"一句话复盘"。明天最重要的一件事是什么，也写一句。');
  const sleep = s => add(s, '', 'rest', '洗漱，放下手机，' + s + ' 前睡着', '睡够 7 小时以上。睡前 30 分钟不刷手机，可以看纸质书。');
  const go = (s, e) => { const r = revSet(key); add(s, e, 'go', '打车去学校（车上复习单词）',
    '<p>车上做：① 单词复习 20 分钟（昨天和 3 天前学的' + r.length + ' 个词，题在下面）；② 行业资讯 10 分钟（' + NEWS[dow][0] + '：' + NEWS[dow][1] + '）；③ 听《广交会采访话术》的跟读音频。晕车就闭眼听。</p>' + wordQuiz(r)); };
  const back = (s, e, extra) => add(s, e, 'back', '坐地铁回家（30～90 分钟）', '地铁上：阅读 30 分钟（' + (READ[wk] || READ[11])[0] + '），剩下的时间做英语听力（BBC Learning English 的 6 Minute English 或 English at Work，戴耳机听，小声跟读）。' + (extra || ''));
  const listen = (s, e) => add(s, e, 'listen', '英语听力 + 影子跟读',
    '<ol><li>材料：BBC Learning English 的 English at Work（办公室和商务情景）或 6 Minute English；每次 1 集。</li>' +
    '<li>第 1 遍只听，抓大意；第 2 遍看字幕，查不认识的词；第 3 遍跟着音频同步说（影子跟读），模仿语调。</li>' +
    '<li>挑 3 个有用的句子写进日志的"句子本"。</li></ol>');

  // 第一天：开始前的准备
  if (key === PLAN_START) {
    wake('07:30', '07:40');
    run('07:45', '08:10', '小区或附近公园，轻松跑', 20);
    meal('08:20', '08:50', 'b');
    add('09:00', '10:30', 'prep', '开始前的准备（只做一次）',
      '<ol><li>把这个页面添加到手机主屏幕（Safari 底部分享按钮 → 添加到主屏幕），以后从主屏幕打开，打勾记录才不会丢。</li>' +
      '<li>确认家附近健身房的营业时间；没有卡就办卡，并约一次教练带你认器械（先学 A、C 日的动作）。</li>' +
      '<li>空腹称体重，量腰围、臀围，拍一张正面和侧面照片，写进日志。以后每两周量一次。</li>' +
      '<li>准备：跑鞋、体重秤、带去学校的运动 T 恤和湿巾（校园跑完换衣服用）、水杯。</li>' +
      '<li>在手机上装一个有语音模式的 AI App，备忘录里建两条笔记："句子本""提示词库"。</li>' +
      '<li>看一遍下面的"本周目标"和"训练""饮食"页。</li></ol>');
    bizItem('10:40', '12:00');
    meal('12:15', '12:45', 'lh');
    add('12:45', '13:05', 'rest', '午休 20 分钟', '');
    words('13:10', '14:10');
    listen('14:15', '14:45');
    eng('14:50', '15:40', '先试一次，熟悉流程');
    add('15:40', '17:00', 'free', '自由时间', '');
    gram('17:00', '17:40');
    meal('18:00', '18:40', 'dh');
    add('19:00', '19:50', 'meet', '阿曼项目启动会（和家人，40～50 分钟）', '照着上午列的清单逐条问，结论写进家庭群请家人确认（手册 1.5、5.1 第 1～2 周）。还要讲清楚这 6 周的安排：每周目标、哪几天在学校、要家人帮的事（办资质、联系老客户工厂、陪你去银行、看选品）。定好每周日 19:00 开周会。');
    read('19:55', '20:30');
    wnight('20:30', '20:50');
    review('20:50', '21:05');
    sleep('22:30');
    return L;
  }

  if (!cls.length && dow === 6) { // 周日
    wake('07:00', '07:10');
    run('07:15', '07:45', '小区或公园，今天放慢', runMin - 5);
    meal('07:50', '08:20', 'b');
    words('08:30', '09:30');
    bizItem('09:35', '11:00');
    if (g) { gym('11:10', '12:25'); meal('12:30', '13:00', 'lh'); }
    else { eng('11:10', '12:00'); meal('12:15', '12:45', 'lh'); }
    add('13:00', '15:30', 'free', '自由时间：休息', '睡个午觉、见朋友、逛街都行。这是一周里最长的一段休息，用来恢复。');
    if (g) eng('15:30', '16:20'); else listen('15:30', '16:10');
    read('16:25', '17:10');
    meal('17:45', '18:30', 'dh');
    add('19:00', '19:40', 'meet', '和家人周会', '讲本周做完了什么、拿到了哪些数字、下周要家人帮什么。需要签字或花钱的事在这里确认（手册 1.5）。');
    add('19:45', '20:15', 'review', '每周复盘 + 合并句子本', '① 对照"本周目标"打勾；② 把这周的句子本合并成一份（开口计划：每周日 10 分钟）；③ 体重写进日志，和上周比；④ 看一眼下周的安排。');
    gram('20:15', '20:50');
    if (!g) add('20:50', '21:10', 'free', '拉伸放松 15 分钟', '泡脚或热水澡，拉伸大腿、臀部、背。');
    sleep('22:30');
    return L;
  }

  if (!cls.length && dow === 5) { // 周六
    const out = biz && biz[2];
    wake('06:45', '06:55');
    run('07:00', '07:40', '小区或公园');
    meal('07:50', '08:20', 'b');
    bizItem('08:40', '12:00', out ? '今天外出。出门前读一遍话术，带上手机记价格。说出第一句就算完成。' : '');
    meal('12:15', '12:45', out ? 'lc' : 'lh');
    add('12:45', '13:05', 'rest', '午休 20 分钟', '');
    words('13:10', '14:10');
    eng('14:15', '15:10');
    gram('15:15', '16:00');
    meal('16:00', '16:10', 'sn');
    gym('16:20', '17:35');
    meal('17:45', '18:25', 'dh');
    school('18:40', '19:40');
    listen('19:45', '20:15');
    read('20:20', '21:00');
    wnight('21:00', '21:20');
    review('21:20', '21:35');
    add('21:35', '22:30', 'free', '自由时间', '');
    sleep('23:00');
    return L;
  }

  if (!cls.length) { // 周一（单周）、周五：在家
    wake('06:30', '06:40');
    run('06:45', '07:20', '小区或公园');
    add('07:20', '07:35', 'rest', '拉伸 + 洗澡', '');
    meal('07:35', '08:00', 'b');
    wrev('08:00', '08:20');
    news('08:20', '08:30');
    bizItem('08:30', '10:30', '上午头脑最清醒，先做这件最重要的事。打电话放在 9 点以后。');
    meal('10:30', '10:40', 'sn');
    words('10:40', '11:40');
    eng('11:40', '12:20');
    meal('12:20', '12:50', 'lh');
    add('12:50', '13:10', 'rest', '午休 20 分钟', '');
    if (!hl('13:15', '14:45')) biz2('13:15', '14:45');
    if (!ai('14:45', '15:30')) biz2('14:45', '15:30');
    listen('15:30', '16:00');
    meal('16:00', '16:10', 'sn');
    gym('16:20', '17:35');
    meal('17:45', '18:25', 'dh');
    gram('18:35', '19:15');
    school('19:20', '20:20');
    read('20:25', '21:05');
    wnight('21:05', '21:25');
    review('21:25', '21:40');
    sleep('23:00');
    return L;
  }

  if (sig === '3') { // 只有上午课
    wake('06:30', '06:40');
    run('06:45', '07:15', '小区或公园', Math.min(runMin, 30));
    add('07:15', '07:30', 'rest', '拉伸 + 洗澡', '');
    meal('07:30', '07:50', 'b');
    eng('07:50', '08:40', '在家练完再出门');
    go('08:45', '10:15');
    klass(cls[0]);
    notes('11:50', '12:05');
    meal('12:05', '12:35', 'lc');
    words('12:35', '13:35', '在图书馆做，戴耳机听读音，小声跟读。');
    bizItem('13:35', '15:00', '在图书馆做；要打电话就去走廊或空教室。');
    if (!ai('15:00', '15:40')) biz2('15:00', '15:40');
    back('15:45', '17:00', dow === 2 ? '顺便：' + HL_WED[1] : '');
    meal('17:00', '17:10', 'sn');
    gym('17:15', '18:30');
    meal('18:40', '19:15', 'dh');
    gram('19:20', '20:00');
    if (!(dow === 0 && hl('20:05', '20:50'))) biz2('20:05', '20:50');
    school('20:55', '21:35');
    wnight('21:35', '21:55');
    review('21:55', '22:10');
    sleep('23:00');
    return L;
  }

  // 下午有课：不在家跑，改校园跑
  wake('06:50', '07:00');
  meal('07:00', '07:20', 'b');
  eng('07:25', '08:35', '在家练完再出门');
  go('08:45', '10:15');
  klass(cls[0]);
  notes('11:50', '12:05');
  if (sig === '3,5,7') { // 周三：网球课
    run('12:05', '12:25', '校园，今天有网球课，跑短一点', 15);
    meal('12:30', '13:00', 'lc');
    words('13:00', '13:55', '在图书馆做，戴耳机听读音，小声跟读。');
    klass(cls[1]);
    add('15:30', '15:50', 'rest', '换运动服', '');
    add('15:50', '17:20', 'cls', '网球课' + (cls[2].r ? '（' + cls[2].r + '）' : ''), '体育课也算今天的运动量，认真打。');
    meal('17:30', '18:00', 'dc');
    back('18:05', '19:30', '顺便：' + HL_WED[1]);
    bizItem('19:40', '20:20', '今天时间短，挑最小的一步做。');
    gram('20:25', '21:00');
    if (!ai('21:00', '21:40')) biz2('21:00', '21:40');
    wnight('21:40', '22:00');
    review('22:00', '22:15');
    sleep('23:00');
    return L;
  }
  meal('12:05', '12:35', 'lc');
  if (sig === '3,5,9') { // 单周周二：上午、下午、晚上都有课
    words('12:35', '13:35', '在图书馆做，戴耳机听读音，小声跟读。');
    bizItem('13:35', '13:55', '挑最小的一步做：回一条消息或填一个数字。');
    klass(cls[1]);
    run('15:40', '16:20', '校园，跑完用湿巾擦汗、换 T 恤');
    if (!ai('16:25', '17:10')) biz2('16:25', '17:10');
    meal('17:15', '17:45', 'dc');
    gram('17:45', '18:25');
    klass(cls[2]);
    back('20:00', '21:20');
    wnight('21:25', '21:45');
    review('21:45', '22:00');
    sleep('23:00');
    return L;
  }
  if (sig === '3,9') { // 第 15 周周二
    words('12:35', '13:35', '在图书馆做，戴耳机听读音，小声跟读。');
    bizItem('13:35', '14:50', '图书馆；打电话去走廊。');
    if (!ai('14:50', '15:35')) biz2('14:50', '15:35');
    run('15:40', '16:20', '校园，跑完用湿巾擦汗、换 T 恤');
    school('16:30', '17:15');
    meal('17:20', '17:50', 'dc');
    gram('17:50', '18:25');
    klass(cls[1]);
    back('20:00', '21:20');
    wnight('21:25', '21:45');
    review('21:45', '22:00');
    sleep('23:00');
    return L;
  }
  // 单周周四：上午 + 下午第 7～8 节
  words('12:35', '13:35', '在图书馆做，戴耳机听读音，小声跟读。');
  bizItem('13:35', '14:25', '图书馆；打电话去走廊。');
  run('14:30', '15:05', '校园，跑完用湿巾擦汗、换 T 恤');
  if (!ai('15:05', '15:45')) biz2('15:05', '15:45');
  klass(cls[1]);
  meal('17:25', '17:55', 'dc');
  back('18:00', '19:20');
  gym('19:35', '20:45');
  meal('20:50', '21:00', 'post');
  gram('21:00', '21:35');
  wnight('21:35', '21:55');
  review('21:55', '22:10');
  sleep('23:15');
  return L;
}

// ---------- 存储 ----------
const S = {
  get: (k, d) => { try { const v = localStorage.getItem('plan:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: (k, v) => localStorage.setItem('plan:' + k, JSON.stringify(v))
};

// ---------- 页面 ----------
let cur = (function () {
  const t = ymd(new Date());
  return t < PLAN_START ? PLAN_START : t > PLAN_END ? PLAN_END : t;
})();
let tab = 'day';
const $ = id => document.getElementById(id);
const nowHM = () => { const n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); };

function pct(key) {
  const L = buildDay(parse(key)), done = S.get('done:' + key, {});
  const n = L.filter((x, i) => x.c !== 'rest' && done[i]).length, t = L.filter(x => x.c !== 'rest').length;
  return t ? Math.round(n / t * 100) : 0;
}

function renderDay() {
  const d = parse(cur), wk = weekOf(d), dow = (d.getDay() + 6) % 7, L = buildDay(d), done = S.get('done:' + cur, {});
  const today = ymd(new Date()) === cur, hm = nowHM();
  const st = STAGE[wk] || {}, wkKey = 'goal:' + wk, gd = S.get(wkKey, {});
  let h = '<div class="stage"><div class="sname">第 ' + wk + ' 周 · ' + (st.name || '') + '</div><div class="goals">' +
    (st.goal || []).map((g, i) => '<label><input type="checkbox" data-goal="' + i + '"' + (gd[i] ? ' checked' : '') + '> ' + g + '</label>').join('') + '</div></div>';
  h += '<div class="list">';
  L.forEach((x, i) => {
    const on = today && x.s <= hm && (x.e ? hm < x.e : false);
    h += '<div class="item c-' + x.c + (done[i] ? ' done' : '') + (on ? ' now' : '') + '" data-i="' + i + '">' +
      '<div class="tm">' + x.s + (x.e ? '<br><span>' + x.e + '</span>' : '') + '</div>' +
      '<div class="bd"><div class="tt">' + ICON[x.c] + ' ' + x.t + (on ? ' <b class="nowtag">进行中</b>' : '') + '</div>' +
      (x.d ? '<div class="dt">' + x.d + '</div>' : '') + '</div>' +
      '<button class="ck" data-ck="' + i + '">' + (done[i] ? '✓' : '') + '</button></div>';
  });
  h += '</div>';
  const lg = S.get('log:' + cur, {});
  h += '<div class="log"><h3>📝 日志</h3>' +
    '<label>体重（kg）<input inputmode="decimal" data-log="w" value="' + (lg.w || '') + '"></label>' +
    '<label>今天训练最重一组（例：臀推 30 kg × 10）<input data-log="g" value="' + esc(lg.g || '') + '"></label>' +
    '<label>句子本（今天说不出来的句子）<textarea rows="3" data-log="s">' + esc(lg.s || '') + '</textarea></label>' +
    '<label>一句话复盘 + 明天最重要的事<textarea rows="2" data-log="r">' + esc(lg.r || '') + '</textarea></label></div>';
  $('main').innerHTML = h;
  $('title').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WD[dow];
  $('sub').textContent = '完成 ' + pct(cur) + '%';
  renderStrip();
  if (today) { const n = document.querySelector('.item.now'); if (n) n.scrollIntoView({block: 'center'}); }
}

function renderStrip() {
  const d = parse(cur), mon = new Date(d.getTime() - ((d.getDay() + 6) % 7) * MS);
  let h = '';
  for (let i = 0; i < 7; i++) {
    const x = new Date(mon.getTime() + i * MS), k = ymd(x), inR = k >= PLAN_START && k <= PLAN_END;
    h += '<button class="dd' + (k === cur ? ' on' : '') + (k === ymd(new Date()) ? ' td' : '') + '"' + (inR ? ' data-go="' + k + '"' : ' disabled') + '>' +
      WD[i].slice(1) + '<b>' + x.getDate() + '</b><i style="--p:' + (inR ? pct(k) : 0) + '%"></i></button>';
  }
  $('strip').innerHTML = h;
}

function renderWeek() {
  const d = parse(cur), mon = new Date(d.getTime() - ((d.getDay() + 6) % 7) * MS), wk = weekOf(d);
  let h = '<div class="card"><h3>第 ' + wk + ' 周概览</h3><table><tr><th>日期</th><th>课</th><th>健身</th><th>业务主任务</th><th>完成</th></tr>';
  for (let i = 0; i < 7; i++) {
    const x = new Date(mon.getTime() + i * MS), k = ymd(x);
    if (k < PLAN_START || k > PLAN_END) continue;
    const L = buildDay(x), c = L.filter(y => y.c === 'cls').map(y => y.t).join('、') || '—';
    const gm = L.find(y => y.c === 'gym'), bz = L.find(y => y.c === 'biz');
    h += '<tr data-go="' + k + '"><td>' + (x.getMonth() + 1) + '/' + x.getDate() + ' ' + WD[i] + '</td><td>' + c + '</td><td>' +
      (gm ? gm.t.replace('健身房：', '') : '休息') + '</td><td>' + (bz ? bz.t : '—') + '</td><td>' + pct(k) + '%</td></tr>';
  }
  h += '</table><p class="tip">点一行跳到那一天。</p></div>';
  h += '<div class="card"><h3>阶段 A 总览（手册 5.1 + 开口练习计划）</h3>' +
    Object.keys(STAGE).map(w => '<p><b>第 ' + w + ' 周</b> ' + STAGE[w].name + '<br><span class="tip">开口：' + STAGE[w].level + '</span></p>').join('') + '</div>';
  h += '<div class="card"><h3>这 6 周之后：出差前的安排</h3><p class="tip">第一次去阿曼定在开斋节后（2027 年 3 月下旬～4 月）。寒假前再一起排成每天的计划。</p>' +
    ROADMAP.map(r => '<p><b>' + r[0] + '</b><br>' + r[1] + '</p>').join('') + '</div>';
  $('main').innerHTML = h;
}

function renderGym() {
  let h = '<div class="card"><h3>每周安排（5 练，减脂塑形）</h3><p>单周（第 11、13、15 周）：周一 A、周四 B、周五 C、周六 D、周日 E。<br>双周（第 12、14、16 周）：周一 A、周二 B、周四 C、周五 D、周六 E，周日休息。<br>周三有网球课，不去健身房。</p><ul>' +
    GYM_RULES.map(x => '<li>' + x + '</li>').join('') + '</ul></div>';
  Object.keys(WORKOUTS).forEach(k => { h += '<div class="card"><h3>' + WORKOUTS[k].name + '</h3>' + gymDetail(k) + '</div>'; });
  h += '<div class="card"><h3>跑步</h3><p>每天都跑。早上没课或只有上午课：起床后在家附近跑；下午有课：在校园跑。每周时长：' +
    Object.keys(RUN_WEEK).map(w => '第 ' + w + ' 周 ' + RUN_WEEK[w] + ' 分钟').join('，') + '。</p><ul>' + RUN_RULES.map(x => '<li>' + x + '</li>').join('') + '</ul></div>';
  $('main').innerHTML = h;
}

function renderFood() {
  let h = '<div class="card"><h3>吃饭的规则</h3><ul>' + MEAL_RULES.map(x => '<li>' + x + '</li>').join('') + '</ul></div>';
  h += '<div class="card"><h3>一周菜单（每天的具体安排在"今日"里）</h3><table><tr><th></th><th>早餐</th><th>午餐（家）</th><th>晚餐（家）</th><th>加餐</th></tr>' +
    WD.map((w, i) => '<tr><td>' + w + '</td><td>' + MEAL.b[i] + '</td><td>' + MEAL.lh[i] + '</td><td>' + MEAL.dh[i] + '</td><td>' + MEAL.snack[i] + '</td></tr>').join('') +
    '</table><p><b>在学校吃：</b>' + MEAL.dc + '</p><p><b>练后：</b>' + MEAL.post + '</p></div>';
  $('main').innerHTML = h;
}

// 语法课
const synth = window.speechSynthesis;
function say(t) {
  if (!synth) return alert('这个浏览器不支持朗读');
  synth.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US'; u.rate = 0.8;
  const v = synth.getVoices().find(x => /en-US/.test(x.lang)); if (v) u.voice = v;
  synth.speak(u);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function renderLesson(html) {
  return html
    .replace(/<ex en="([^"]*)" zh="([^"]*)"(?: tip="([^"]*)")?\s*\/>/g, (m, en, zh, tip) =>
      '<div class="ex"><button class="play" data-say="' + esc(en) + '">▶</button><div><div class="en">' + esc(en) + '</div><div>' + zh + '</div>' + (tip ? '<div class="tip">💡 ' + tip + '</div>' : '') + '</div></div>')
    .replace(/<quiz q="([^"]*)" opts="([^"]*)" ans="(\d+)" why="([^"]*)"(?: en="([^"]*)")?\s*\/>/g, (m, q, opts, ans, why, en) =>
      '<div class="q" data-why="' + esc(why) + '" data-en="' + esc(en || '') + '"><div>📝 ' + q + '</div>' +
      opts.split('|').map((o, i) => '<button class="opt" data-ok="' + (i == ans ? 1 : 0) + '">' + o + '</button>').join('') + '<div class="fb"></div></div>');
}
function openLesson(i) {
  const l = LESSONS[i], dn = S.get('gram', []);
  $('lesson').innerHTML = '<div class="lhead"><button id="lclose">✕ 关闭</button><span>' + l.part + '</span></div><h2>' + l.title + '</h2>' + renderLesson(l.body) +
    '<div class="lbtn">' + (i > 0 ? '<button data-l="' + (i - 1) + '">⬅ 上一课</button>' : '') +
    '<button class="mk" data-mark="' + i + '">' + (dn.includes(l.id) ? '✔ 已学会' : '我学会了，打勾') + '</button>' +
    (i < LESSONS.length - 1 ? '<button data-l="' + (i + 1) + '">下一课 ➡</button>' : '') + '</div>';
  $('lesson').classList.add('show'); $('lesson').scrollTop = 0;
}
function renderGram() {
  const dn = S.get('gram', []);
  let h = '<div class="card"><h3>英语语法零基础手册（' + dn.length + ' / ' + LESSONS.length + ' 课）</h3><p class="tip">每天的课已经排进"今日"。这里可以随时翻任何一课。例句点 ▶ 朗读（用 iPhone 自带的英语声音）。</p>';
  let last = '';
  LESSONS.forEach((l, i) => {
    if (l.part !== last) { h += '<div class="part">' + l.part + '</div>'; last = l.part; }
    h += '<button class="lrow" data-l="' + i + '">' + (dn.includes(l.id) ? '✅ ' : '') + l.title + '</button>';
  });
  $('main').innerHTML = h + '</div>';
}

function renderWords() {
  const t = ymd(new Date()), upto = t < PLAN_START ? PLAN_START : t;
  let h = '<div class="card"><h3>单词本（' + WORDS.length + ' 个，按每天的顺序）</h3><p class="tip">' + catCount(WORDS.map((x, i) => i)) + '。音标是美式。🔊 读单词，▶ 读例句（用 iPhone 自带的英语声音，静音键要关掉）。</p>' +
    '<input id="wsearch" placeholder="搜索英文或中文" style="width:100%;font-size:16px;padding:8px;border:1px solid #ddd;border-radius:8px"></div>';
  const days = Object.keys(WDAY).filter(k => !isReview(k) && WDAY[k].length);
  h += '<div id="wlist">' + days.map(k => '<div class="card wday" data-k="' + k + '"><h3>' + (parse(k).getMonth() + 1) + '/' + parse(k).getDate() + (k <= upto ? '' : '（还没到）') + '</h3>' +
    WDAY[k].map(wordCard).join('') + '</div>').join('') + '</div>';
  $('main').innerHTML = h;
}

function renderHelp() {
  $('main').innerHTML = '<div class="card"><h3>怎么用</h3><ul>' +
    '<li>每天打开就是今天的安排。点任务右边的圆圈打勾，点任务本身展开详细做法。</li>' +
    '<li>上方一排是本周 7 天，圆环是完成度。左右按钮切换日期。</li>' +
    '<li>打勾和日志只存在这台手机的浏览器里。<b>请从主屏幕图标打开</b>：Safari 对普通网页的数据最多保留 7 天不访问就可能清掉，添加到主屏幕后不会。</li>' +
    '<li>每周日点下面"导出备份"，存到"文件"App 里。换手机或数据丢了，用"导入备份"恢复。</li></ul>' +
    '<p><button id="exp">导出备份</button> <label class="imp">导入备份<input type="file" id="imp" accept=".json"></label></p></div>' +
    '<div class="card"><h3>这份计划依据什么</h3><ul>' +
    '<li>课程表：第 11～16 周（2026-11-16 至 12-27）。</li>' +
    '<li>业务任务：《小国切入实战手册》5.1 阶段 A。项目 11 月 15 日才开始，第一次出差改到开斋节后（2027 年 3 月下旬～4 月），阶段 A 拉长到约 17 周。这 6 周只做国内部分：资质、选品、询价、成本表、第一版报价；找阿曼伙伴、店铺名单、出差准备放到寒假以后（见"本周"页底部）。</li>' +
    '<li>时间比例：手册 1.6（英语每周 8～10 小时、行业学习 8～10 小时、AI 4～6 小时、每天睡够 7 小时）。</li>' +
    '<li>英语：每天开口 4 步 + 新单词约 ' + (WDAY[LDAYS[1]] || []).length + ' 个（上车或早上复习前几天的词，睡前自测当天的词，周日复习本周的）+ 听力跟读 + 语法手册 1 课（周六 2 课，周日复习）。单词共 ' + WORDS.length + ' 个（' + catCount(WORDS.map((x, i) => i)) + '），每个有读音、音标、词性、意思和例句。</li>' +
    '<li>华磊：每周一做周毛利，周五学一个流程，对应电脑上 hualei-tms skill 的 6 份文档。</li></ul>' +
    '<p class="tip">期末考试日期出来后，告诉 Claude，把考试周和前两周的任务再调轻（手册 5.1：考试前两周项目降到每周 30 小时）。</p></div>';
}

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('daybar').style.display = tab === 'day' ? '' : 'none';
  ({day: renderDay, week: renderWeek, gym: renderGym, food: renderFood, gram: renderGram, words: renderWords, help: renderHelp})[tab]();
  if (tab !== 'day') window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-ck],[data-go],[data-tab],[data-l],[data-mark],[data-say],.opt,#prev,#next,#today,#lclose,#exp,.item');
  if (!t) return;
  if (t.dataset.ck != null) { const d = S.get('done:' + cur, {}); d[t.dataset.ck] = !d[t.dataset.ck]; S.set('done:' + cur, d); renderDay(); return; }
  if (t.dataset.go) { cur = t.dataset.go; tab = 'day'; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.dataset.l != null) { openLesson(+t.dataset.l); return; }
  if (t.dataset.mark != null) { const i = +t.dataset.mark, id = LESSONS[i].id, d = S.get('gram', []), k = d.indexOf(id); k >= 0 ? d.splice(k, 1) : d.push(id); S.set('gram', d); openLesson(i); return; }
  if (t.dataset.say) { say(t.dataset.say); return; }
  if (t.classList.contains('opt')) {
    const q = t.closest('.q'); if (q.dataset.done) return; q.dataset.done = 1;
    const ok = t.dataset.ok === '1'; t.classList.add(ok ? 'right' : 'wrong');
    q.querySelectorAll('.opt').forEach(b => b.dataset.ok === '1' && b.classList.add('right'));
    q.querySelector('.fb').textContent = (ok ? '✅ 答对了！' : '❌ 再看看：') + ' ' + q.dataset.why;
    if (q.dataset.en) say(q.dataset.en); return;
  }
  if (t.id === 'prev' || t.id === 'next') {
    const n = ymd(new Date(parse(cur).getTime() + (t.id === 'prev' ? -MS : MS)));
    if (n >= PLAN_START && n <= PLAN_END) { cur = n; tab = 'day'; render(); window.scrollTo(0, 0); } return;
  }
  if (t.id === 'today') { const k = ymd(new Date()); cur = k < PLAN_START ? PLAN_START : k > PLAN_END ? PLAN_END : k; tab = 'day'; render(); return; }
  if (t.id === 'lclose') { $('lesson').classList.remove('show'); if (synth) synth.cancel(); if (tab === 'gram') renderGram(); return; }
  if (t.id === 'exp') {
    const o = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('plan:')) o[k] = localStorage.getItem(k); }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], {type: 'application/json'}));
    a.download = '每日计划备份-' + ymd(new Date()) + '.json'; a.click(); return;
  }
  if (t.classList.contains('item') && !e.target.closest('button,a,input,textarea')) t.classList.toggle('open');
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.goal != null) { const k = 'goal:' + weekOf(parse(cur)), g = S.get(k, {}); g[t.dataset.goal] = t.checked; S.set(k, g); }
  if (t.id === 'imp' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); Object.keys(o).forEach(k => k.startsWith('plan:') && localStorage.setItem(k, o[k])); alert('已恢复'); render(); } catch (x) { alert('文件不对'); } };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'wsearch') { const q = t.value.trim().toLowerCase(); document.querySelectorAll('#wlist .wd').forEach(x => x.style.display = !q || x.textContent.toLowerCase().includes(q) ? '' : 'none'); return; }
  if (t.dataset.log == null) return;
  const lg = S.get('log:' + cur, {}); lg[t.dataset.log] = t.value; S.set('log:' + cur, lg);
});

render();
setInterval(() => { if (tab === 'day' && cur === ymd(new Date()) && !document.querySelector('.item.open') && document.activeElement.tagName === 'BODY') renderDay(); }, 300000);

</script>
