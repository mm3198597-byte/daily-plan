LESSONS.push({id:'todo', part:'第4部分 动词进阶', title:'31. 动词不定式：to + 动词原形', body:`
<p>英语一个句子里，主动词只能有一个。如果还想放第二个动词，就要把它变成「非谓语动词」。第一种就是 <b>to do</b>。</p>
<div class="note">
<h3>① 常见用法</h3>
<p>1. 做宾语（跟在某些动词后）：I want <b>to go</b>.（我想去）<br>
2. 表示目的「为了…」：I came here <b>to see</b> you.（我来这里是为了见你）<br>
3. 做主语（常用 it 代替）：<b>It</b> is easy <b>to learn</b> English.（学英语很容易）<br>
4. 放在名词后修饰：I have a lot of work <b>to do</b>.（我有很多工作要做）<br>
5. 疑问词 + to do：I don't know <b>what to do</b>.（我不知道该做什么）</p>
<h3>② 后面接 to do 的常见动词</h3>
<p>want 想，would like 想要，hope 希望，plan 计划，decide 决定，need 需要，learn 学习，try 尽力，forget 忘记，agree 同意，promise 承诺，refuse 拒绝，choose 选择</p>
<h3>③ 不带 to 的情况</h3>
<p>1. 情态动词后：can <b>go</b><br>
2. let / make / have（让、使）+ 人 + 动词原形：Let me <b>help</b> you. / He made me <b>laugh</b>.<br>
3. see / hear / watch（感官动词）+ 人 + 动词原形（看见全过程）：I saw him <b>leave</b>.</p>
<h3>④ 否定：not to do</h3>
<p>He told me <b>not to</b> worry.（他叫我别担心）</p>
</div>
<ex en="I want to learn English." zh="我想学英语。"/>
<ex en="She went to the shop to buy some milk." zh="她去商店买牛奶。" tip="to buy 表示目的"/>
<ex en="It is important to drink water." zh="喝水很重要。"/>
<ex en="I have something to tell you." zh="我有件事要告诉你。"/>
<ex en="Let me think about it." zh="让我想一想。" tip="let 后面用原形，不加 to"/>
<ex en="My boss asked me to call the client." zh="老板让我给客户打电话。"/>
<quiz q="I hope ___ you again." opts="see|to see|seeing" ans="1" why="hope 后面接 to do。" en="I hope to see you again."/>
<quiz q="Let him ___ in." opts="come|to come|comes" ans="0" why="let 后面用动词原形，不带 to。" en="Let him come in."/>
`});

LESSONS.push({id:'doing', part:'第4部分 动词进阶', title:'32. 动名词：动词-ing 当名词用', body:`
<div class="note">
<h3>① 动名词是什么</h3>
<p>把动词加 -ing，就能当<b>名词</b>用，意思是「做…这件事」。<br>
swim 游泳（动作）→ <b>swimming</b> 游泳（这项运动）</p>
<h3>② 常见用法</h3>
<p>1. 做主语：<b>Swimming</b> is good for health.（游泳对健康有益）<br>
2. 做宾语：I like <b>reading</b>.<br>
3. 介词后面（必须用 -ing！）：I'm good <b>at cooking</b>. / Thank you <b>for helping</b> me. / <b>before leaving</b></p>
<h3>③ 后面只能接 doing 的常见动词</h3>
<p>enjoy 喜欢，finish 完成，mind 介意，keep 一直，practice 练习，suggest 建议，avoid 避免，miss 错过，can't help 忍不住，be busy 忙于，feel like 想要，look forward to 期待<br>
口诀：<b>完成练习，值得期待；喜欢建议，不禁介意</b></p>
<h3>④ 接 to do 和 doing 意思不同的动词</h3>
<table>
<tr><th>动词</th><th>+ to do</th><th>+ doing</th></tr>
<tr><td>stop</td><td>停下来<b>去做另一件事</b>：stop to rest（停下来休息）</td><td>停止<b>正在做的事</b>：stop smoking（戒烟）</td></tr>
<tr><td>remember</td><td>记得<b>要去做</b>（还没做）</td><td>记得<b>做过</b>（已经做了）</td></tr>
<tr><td>forget</td><td>忘了<b>要去做</b></td><td>忘了<b>做过</b></td></tr>
<tr><td>try</td><td>努力去做</td><td>试着做做看</td></tr>
</table>
<p>💡 like / love / start / begin 后接 to do 或 doing 都可以，意思差不多。</p>
</div>
<ex en="I enjoy listening to music." zh="我喜欢听音乐。"/>
<ex en="Reading is my hobby." zh="读书是我的爱好。"/>
<ex en="Have you finished writing the report?" zh="你写完报告了吗？"/>
<ex en="Thank you for coming." zh="谢谢你来。" tip="for 是介词，后面用 coming"/>
<ex en="I'm looking forward to hearing from you." zh="期待你的回复。" tip="商务邮件常用结尾，to 是介词，后面用 -ing"/>
<ex en="Remember to lock the door." zh="记得锁门。"/>
<quiz q="Do you mind ___ the window?" opts="open|to open|opening" ans="2" why="mind 后接 doing。" en="Do you mind opening the window?"/>
<quiz q="He is good at ___." opts="swim|to swim|swimming" ans="2" why="介词 at 后用 -ing。" en="He is good at swimming."/>
<quiz q="He stopped ___.（他戒烟了）" opts="to smoke|smoking" ans="1" why="停止正在做的事，用 stop doing。" en="He stopped smoking."/>
`});

;
LESSONS.push({id:'participle', part:'第4部分 动词进阶', title:'33. 分词：-ing 和 -ed 当形容词', body:`
<div class="note">
<h3>① 现在分词 doing 和过去分词 done</h3>
<p><b>-ing（现在分词）</b>：表示「主动」「正在」，或「令人…的」<br>
<b>-ed（过去分词）</b>：表示「被动」「已完成」，或「（人）感到…的」</p>
<h3>② 最常考：-ing 和 -ed 形容词</h3>
<table>
<tr><th>-ing：东西「令人…」</th><th>-ed：人「感到…」</th></tr>
<tr><td>interesting 有趣的</td><td>interested 感兴趣的</td></tr>
<tr><td>boring 无聊的</td><td>bored 感到无聊的</td></tr>
<tr><td>exciting 令人兴奋的</td><td>excited 感到兴奋的</td></tr>
<tr><td>tiring 令人累的</td><td>tired 感到累的</td></tr>
<tr><td>surprising 令人惊讶的</td><td>surprised 感到惊讶的</td></tr>
</table>
<p>The movie is <b>boring</b>. I am <b>bored</b>.（电影很无聊，我觉得无聊）<br>
⚠️ 说 I am boring 意思是「我这个人很无聊」！</p>
<h3>③ 分词修饰名词</h3>
<p>a <b>sleeping</b> baby 一个正在睡觉的婴儿（主动）<br>
a <b>broken</b> cup 一个被打破的杯子（被动）<br>
the man <b>standing</b> there 站在那里的男人<br>
the book <b>written</b> by Lu Xun 鲁迅写的书</p>
<h3>④ 分词短语表示时间、原因</h3>
<p><b>Hearing</b> the news, she cried.（听到这个消息，她哭了）<br>
<b>Seen</b> from the hill, the city looks beautiful.（从山上看，城市很美）</p>
</div>
<ex en="This book is very interesting." zh="这本书很有趣。"/>
<ex en="I'm interested in history." zh="我对历史感兴趣。"/>
<ex en="I'm so tired after work." zh="下班后我好累。"/>
<ex en="Do you know the girl wearing a red dress?" zh="你认识那个穿红裙子的女孩吗？"/>
<ex en="I found a broken window." zh="我发现了一扇破窗户。"/>
<quiz q="The news is ___.（令人兴奋）" opts="exciting|excited" ans="0" why="消息「令人」兴奋，用 -ing。" en="The news is exciting."/>
<quiz q="I'm ___ in music." opts="interesting|interested" ans="1" why="人「感到」感兴趣，用 -ed；be interested in 是固定搭配。" en="I'm interested in music."/>
`});

LESSONS.push({id:'patterns', part:'第5部分 句子结构', title:'34. 五种基本句型', body:`
<p>所有英语句子，去掉修饰的部分，都逃不出下面 5 种骨架。认识它们，再长的句子也能拆开。</p>
<div class="note">
<h3>先认识几个名称</h3>
<p><b>主语</b>（谁）、<b>谓语</b>（动词）、<b>宾语</b>（动作对象）、<b>表语</b>（跟在 be 等系动词后，说明主语是什么/怎么样）、<b>补语</b>（补充说明宾语）</p>
<table>
<tr><th>句型</th><th>结构</th><th>例子</th></tr>
<tr><td>1</td><td>主语 + 谓语</td><td>Birds <b>fly</b>.（鸟飞）</td></tr>
<tr><td>2</td><td>主语 + 系动词 + 表语</td><td>She <b>is</b> a nurse. / He <b>looks</b> happy.</td></tr>
<tr><td>3</td><td>主语 + 谓语 + 宾语</td><td>I <b>love</b> you.</td></tr>
<tr><td>4</td><td>主语 + 谓语 + 间接宾语(人) + 直接宾语(物)</td><td>He <b>gave</b> me a book.</td></tr>
<tr><td>5</td><td>主语 + 谓语 + 宾语 + 宾语补足语</td><td>We <b>call</b> him Tom. / It <b>makes</b> me happy.</td></tr>
</table>
<h3>系动词（后面接形容词，不接副词）</h3>
<p>be 是；look 看起来；sound 听起来；smell 闻起来；taste 尝起来；feel 感觉；become / get / turn 变得；seem 似乎；keep / stay 保持<br>
✅ It tastes <b>good</b>.（❌ tastes well）</p>
<h3>句型 4 的两种写法</h3>
<p>give me a book = give a book <b>to</b> me<br>
buy me a gift = buy a gift <b>for</b> me</p>
</div>
<ex en="The baby is sleeping." zh="宝宝在睡觉。" tip="句型1"/>
<ex en="You look tired." zh="你看起来很累。" tip="句型2，look 是系动词，后接形容词"/>
<ex en="I need your help." zh="我需要你的帮助。" tip="句型3"/>
<ex en="Please send me the invoice." zh="请把发票发给我。" tip="句型4：me 是人，the invoice 是物"/>
<ex en="Please keep the door open." zh="请让门开着。" tip="句型5：open 补充说明 the door"/>
<quiz q="The soup smells ___." opts="good|well" ans="0" why="smell 是系动词，后面接形容词 good。" en="The soup smells good."/>
<quiz q="He bought a gift ___ his wife." opts="to|for" ans="1" why="buy sth for sb。" en="He bought a gift for his wife."/>
`});

LESSONS.push({id:'agree', part:'第5部分 句子结构', title:'35. 主谓一致：用 is 还是 are', body:`
<div class="note">
<h3>基本原则：主语是单数，动词用单数；主语是复数，动词用复数</h3>
<p>The boy <b>is</b>… / The boys <b>are</b>…</p>
<h3>容易错的情况</h3>
<p>1. A <b>and</b> B 做主语 → 复数：Tom and I <b>are</b> friends.<br>
2. every / each / everyone / nobody / something 等 → 单数：Everyone <b>is</b> here.<br>
3. 不可数名词 → 单数：The news <b>is</b> good.（news 虽然有 s 但不可数）<br>
4. 动名词/不定式做主语 → 单数：Swimming <b>is</b> fun.<br>
5. 主语后面有修饰，<b>看真正的主语</b>：The box <b>of apples</b> <b>is</b> heavy.（主语是 box）<br>
6. 时间、金钱、距离当整体 → 单数：Ten dollars <b>is</b> enough.<br>
7. 就近原则（离动词最近的主语说了算）：either…or…，neither…nor…，not only…but also…，there be<br>
Neither he nor <b>I am</b> right.<br>
8. 总是复数的词：people 人们，police 警察，clothes 衣服，trousers 裤子，glasses 眼镜：The police <b>are</b> coming.<br>
9. A with B / A as well as B → 看 A：The teacher with his students <b>is</b> here.</p>
</div>
<ex en="My brother and I are both teachers." zh="我哥哥和我都是老师。"/>
<ex en="Each student has a book." zh="每个学生都有一本书。"/>
<ex en="The news is very surprising." zh="这个消息很令人惊讶。"/>
<ex en="Learning English is not difficult." zh="学英语不难。"/>
<ex en="The people here are very friendly." zh="这里的人很友好。"/>
<quiz q="Everybody ___ happy." opts="is|are" ans="0" why="everybody 当单数。" en="Everybody is happy."/>
<quiz q="The color of the flowers ___ beautiful." opts="is|are" ans="0" why="真正的主语是 the color（单数）。" en="The color of the flowers is beautiful."/>
`});

LESSONS.push({id:'compound', part:'第5部分 句子结构', title:'36. 简单句、并列句、复合句', body:`
<div class="note">
<h3>① 三种句子</h3>
<p><b>简单句</b>：只有一套「主语 + 谓语」。I like tea.<br>
<b>并列句</b>：两个简单句，用 and / but / or / so 连起来，地位平等。I like tea, <b>but</b> she likes coffee.<br>
<b>复合句</b>：一个<b>主句</b> + 一个或多个<b>从句</b>。从句是句子里的一个「小句子」，不能单独成句。<br>
I know <b>that he is right</b>.（that he is right 是从句）</p>
<h3>② 从句的三大类（后面几课详细讲）</h3>
<table>
<tr><th>从句类型</th><th>在句子里当什么</th><th>例子</th></tr>
<tr><td>名词性从句</td><td>当名词用（主语、宾语、表语）</td><td>I think <b>(that) you are right</b>.</td></tr>
<tr><td>定语从句</td><td>当形容词用，修饰前面的名词</td><td>the man <b>who lives next door</b></td></tr>
<tr><td>状语从句</td><td>当副词用，表示时间、原因、条件等</td><td>I'll call you <b>when I arrive</b>.</td></tr>
</table>
<p>💡 拆长句的方法：先找主句的主语和谓语（句子骨架），剩下的都是修饰。</p>
</div>
<ex en="I was tired, so I went to bed early." zh="我累了，所以早早上床了。" tip="并列句"/>
<ex en="I think that you are right." zh="我认为你是对的。" tip="复合句，that 引导宾语从句"/>
<ex en="The man who called you is my boss." zh="给你打电话的那个人是我老板。" tip="复合句，who 引导定语从句"/>
`});

;
LESSONS.push({id:'nounclause', part:'第6部分 从句', title:'37. 名词性从句（宾语从句等）', body:`
<p>名词性从句就是用一个小句子当名词。最常用的是<b>宾语从句</b>：放在动词后面当宾语。</p>
<div class="note">
<h3>① 引导词</h3>
<p><b>that</b>（无意思，常可省略）：I know <b>(that)</b> he is busy.<br>
<b>if / whether</b>（是否）：I don't know <b>if</b> he will come.<br>
<b>疑问词</b> what / who / where / when / why / how：Do you know <b>where</b> she lives?</p>
<h3>② 最重要：从句要用「陈述句语序」</h3>
<p>直接问：Where <b>does she live</b>?（疑问语序）<br>
放进从句：Do you know where <b>she lives</b>?（陈述语序：主语在前，动词在后，不加 does）<br>
❌ Can you tell me where is the station?<br>
✅ Can you tell me where <b>the station is</b>?</p>
<h3>③ 时态呼应</h3>
<p>主句是过去时，从句一般也用过去的时态：<br>
He said that he <b>was</b> busy.<br>
例外：客观真理用一般现在时：The teacher said the earth <b>goes</b> around the sun.</p>
<h3>④ 其他名词性从句</h3>
<p>主语从句：<b>What he said</b> is true.（他说的是真的）<br>
表语从句：The problem is <b>that we have no money</b>.<br>
同位语从句：The news <b>that he won</b> made us happy.</p>
</div>
<ex en="I think it will rain." zh="我觉得要下雨了。" tip="省略了 that"/>
<ex en="I don't know what you mean." zh="我不知道你什么意思。"/>
<ex en="Can you tell me where the bathroom is?" zh="你能告诉我洗手间在哪吗？" tip="从句里 the bathroom 在 is 前面"/>
<ex en="I'm not sure if the price includes tax." zh="我不确定价格是否含税。"/>
<ex en="What you need is a good rest." zh="你需要的是好好休息。" tip="主语从句"/>
<quiz q="Do you know ___?" opts="how old is he|how old he is" ans="1" why="从句用陈述语序。" en="Do you know how old he is?"/>
<quiz q="She asked me ___ I liked the gift.（是否）" opts="that|if|what" ans="1" why="「是否」用 if 或 whether。" en="She asked me if I liked the gift."/>
`});

LESSONS.push({id:'relclause', part:'第6部分 从句', title:'38. 定语从句：…的那个人/东西', body:`
<p>中文把修饰放在名词<b>前面</b>：「<b>住在隔壁的</b>那个男人」。英语如果修饰是一个句子，要放在名词<b>后面</b>：the man <b>who lives next door</b>。</p>
<div class="note">
<h3>① 关系词（连接名词和从句）</h3>
<table>
<tr><th>关系词</th><th>指代</th><th>例子</th></tr>
<tr><td>who</td><td>人（做主语）</td><td>the girl <b>who</b> sings</td></tr>
<tr><td>whom</td><td>人（做宾语，常用 who 代替）</td><td>the man <b>whom</b> I met</td></tr>
<tr><td>which</td><td>东西</td><td>the book <b>which</b> I bought</td></tr>
<tr><td>that</td><td>人或东西都行</td><td>the car <b>that</b> is red</td></tr>
<tr><td>whose</td><td>…的（所属）</td><td>the boy <b>whose</b> father is a doctor</td></tr>
<tr><td>where</td><td>地点</td><td>the city <b>where</b> I was born</td></tr>
<tr><td>when</td><td>时间</td><td>the day <b>when</b> we met</td></tr>
<tr><td>why</td><td>原因（the reason why）</td><td>the reason <b>why</b> he left</td></tr>
</table>
<h3>② 怎么造：两句合一句</h3>
<p>I have a friend. + <b>She</b> lives in Dubai.<br>
→ I have a friend <b>who</b> lives in Dubai.（用 who 代替 she）</p>
<h3>③ 关系词做宾语时可以省略</h3>
<p>This is the book <b>(that)</b> I bought yesterday.<br>
⚠️ 从句里不能再重复宾语：❌ the book that I bought <b>it</b></p>
<h3>④ 只用 that 不用 which 的情况</h3>
<p>前面有 all / everything / nothing / the only / the first / 最高级：<br>
This is the best movie <b>that</b> I have ever seen.</p>
<h3>⑤ 加逗号的定语从句（非限制性）</h3>
<p>只是补充说明，不能用 that：My father, <b>who</b> is 60, still works.</p>
</div>
<ex en="I have a friend who lives in Dubai." zh="我有个住在迪拜的朋友。"/>
<ex en="This is the phone that I bought last week." zh="这是我上周买的手机。"/>
<ex en="The man you met yesterday is my uncle." zh="你昨天见的那个人是我叔叔。" tip="省略了 who/that"/>
<ex en="This is the place where I grew up." zh="这是我长大的地方。"/>
<ex en="I know a girl whose mother is a singer." zh="我认识一个妈妈是歌手的女孩。"/>
<ex en="Is this the only thing that you want?" zh="这是你唯一想要的东西吗？"/>
<quiz q="The woman ___ is talking to Tom is my sister." opts="who|which|where" ans="0" why="指人，并在从句里做主语，用 who。" en="The woman who is talking to Tom is my sister."/>
<quiz q="This is the hotel ___ we stayed last year." opts="which|where|who" ans="1" why="从句里缺地点状语（在那里住），用 where。" en="This is the hotel where we stayed last year."/>
<quiz q="哪句对？" opts="The cake that I made it is good.|The cake that I made is good." ans="1" why="that 已经代替了 the cake，不能再加 it。" en="The cake that I made is good."/>
`});

LESSONS.push({id:'advclause', part:'第6部分 从句', title:'39. 状语从句：时间、原因、条件…', body:`
<div class="note">
<h3>① 状语从句的种类和引导词</h3>
<table>
<tr><th>类型</th><th>引导词</th></tr>
<tr><td>时间</td><td>when 当…时，while 在…期间，before 之前，after 之后，until 直到，as soon as 一…就…，since 自从</td></tr>
<tr><td>原因</td><td>because 因为，since / as 既然、由于</td></tr>
<tr><td>条件</td><td>if 如果，unless 除非（= if not），as long as 只要</td></tr>
<tr><td>让步</td><td>although / though 虽然，even if 即使</td></tr>
<tr><td>目的</td><td>so that 为了，in order that</td></tr>
<tr><td>结果</td><td>so + 形容词 + that 如此…以至于，such + 名词 + that</td></tr>
<tr><td>比较</td><td>than 比，as…as 和…一样</td></tr>
<tr><td>地点</td><td>where 在…地方</td></tr>
</table>
<h3>② 超重要规则：「主将从现」</h3>
<p>时间从句和条件从句里，<b>主句用将来时，从句用一般现在时</b>表示将来。<br>
✅ I will call you when I <b>arrive</b>.（❌ when I will arrive）<br>
✅ If it <b>rains</b> tomorrow, I will stay home.（❌ If it will rain）</p>
<h3>③ 从句位置</h3>
<p>放前面要加逗号：<b>When I was young,</b> I lived in a village.<br>
放后面不加：I lived in a village <b>when I was young</b>.</p>
<h3>④ until 的用法</h3>
<p>动作持续：I waited <b>until</b> he came.（我一直等到他来）<br>
not…until 直到…才：I <b>didn't</b> sleep <b>until</b> 12.（我直到 12 点才睡）</p>
</div>
<ex en="I will call you as soon as I get there." zh="我一到那里就给你打电话。" tip="主将从现：get 用一般现在时"/>
<ex en="If you have any questions, please let me know." zh="如果你有任何问题，请告诉我。" tip="商务邮件常用"/>
<ex en="You can't go out unless you finish your homework." zh="除非你做完作业，否则不能出去。"/>
<ex en="She was so tired that she fell asleep at once." zh="她太累了，马上就睡着了。"/>
<ex en="Although it was cold, we went swimming." zh="虽然很冷，我们还是去游泳了。"/>
<ex en="Please speak loudly so that everyone can hear you." zh="请大声说话，好让每个人都能听见。"/>
<quiz q="If it ___ tomorrow, we won't go." opts="rains|will rain|rained" ans="0" why="主将从现：if 从句用一般现在时。" en="If it rains tomorrow, we won't go."/>
<quiz q="I didn't go to bed ___ midnight.（直到半夜才睡）" opts="when|until|since" ans="1" why="not…until 直到…才。" en="I didn't go to bed until midnight."/>
`});

LESSONS.push({id:'cond', part:'第6部分 从句', title:'40. 虚拟语气：如果我是你……', body:`
<p>虚拟语气用来说<b>不是真的、不可能的、假设的</b>事情。英语靠「时态往后退一步」表示「这只是假设」。</p>
<div class="note">
<h3>① if 条件句三种虚拟</h3>
<table>
<tr><th>假设的是</th><th>if 从句</th><th>主句</th></tr>
<tr><td>和<b>现在</b>事实相反</td><td>动词过去式（be 一律用 <b>were</b>）</td><td>would / could + 动词原形</td></tr>
<tr><td>和<b>过去</b>事实相反</td><td>had + 过去分词</td><td>would / could + have + 过去分词</td></tr>
<tr><td>对<b>将来</b>不太可能的假设</td><td>过去式 / should + 原形 / were to + 原形</td><td>would / could + 动词原形</td></tr>
</table>
<p>现在：If I <b>were</b> you, I <b>would</b> take the job.（如果我是你，我会接受这份工作——我不是你）<br>
过去：If I <b>had studied</b> harder, I <b>would have passed</b>.（如果当时努力学了，我就通过了——实际没通过）</p>
<h3>② 对比：真实条件句（不是虚拟）</h3>
<p>If it rains, I will stay home.（有可能真的下雨，用正常的「主将从现」）</p>
<h3>③ wish 表示「真希望…」（不能实现的愿望）</h3>
<p>I wish I <b>were</b> rich.（真希望我很有钱——现在不是）<br>
I wish I <b>had gone</b> there.（真希望当时去了——过去没去）<br>
I wish it <b>would</b> stop raining.（真希望雨能停——将来）</p>
<h3>④ 其他常见虚拟</h3>
<p>It's time we <b>went</b> home.（我们该回家了）<br>
I'd rather you <b>stayed</b>.（我宁愿你留下）<br>
suggest / insist / order / demand + that + 主语 + <b>(should) 动词原形</b>：<br>
I suggest that he <b>(should) see</b> a doctor.</p>
</div>
<ex en="If I were you, I would accept the offer." zh="如果我是你，我会接受这个报价。"/>
<ex en="If I had more time, I would learn to swim." zh="如果我有更多时间，我会学游泳。"/>
<ex en="If you had told me earlier, I could have helped you." zh="如果你早点告诉我，我本可以帮你的。"/>
<ex en="I wish I could speak English well." zh="真希望我能说好英语。"/>
<ex en="I suggest that we have a meeting." zh="我建议我们开个会。"/>
<quiz q="If I ___ a bird, I would fly to you." opts="am|was|were" ans="2" why="和现在事实相反，be 用 were。" en="If I were a bird, I would fly to you."/>
<quiz q="If he had left earlier, he ___ the train." opts="would catch|would have caught|will catch" ans="1" why="和过去事实相反：would have + 过去分词。" en="If he had left earlier, he would have caught the train."/>
`});

;
LESSONS.push({id:'possess', part:'第7部分 常用小语法', title:'41. 名词所有格：Tom\'s', body:`
<div class="note">
<h3>① 人或动物：加 's</h3>
<p>Tom<b>'s</b> book 汤姆的书；my mother<b>'s</b> car 我妈妈的车<br>
以 s 结尾的复数，只加 '：the students<b>'</b> books 学生们的书<br>
不以 s 结尾的复数，加 's：children<b>'s</b> toys 孩子们的玩具<br>
两人共有，只在最后加：Tom and Lucy<b>'s</b> room（共同的房间）<br>
各自拥有，分别加：Tom<b>'s</b> and Lucy<b>'s</b> rooms（各自的房间）</p>
<h3>② 东西：用 of</h3>
<p>the door <b>of</b> the room 房间的门；the name <b>of</b> the company 公司的名字</p>
<h3>③ 's 的三个意思（别搞混）</h3>
<p>Tom's book → 所有格「的」<br>
He's tall → he <b>is</b><br>
He's gone → he <b>has</b></p>
</div>
<ex en="This is my sister's room." zh="这是我姐姐的房间。"/>
<ex en="Where is the teachers' office?" zh="老师们的办公室在哪里？"/>
<ex en="What's the name of the street?" zh="这条街叫什么名字？"/>
<quiz q="这是孩子们的房间。" opts="childrens' room|children's room" ans="1" why="children 不以 s 结尾，加 's。" en="This is the children's room."/>
`});

LESSONS.push({id:'quant', part:'第7部分 常用小语法', title:'42. 多少：some/any/many/much', body:`
<div class="note">
<table>
<tr><th>词</th><th>意思</th><th>跟可数</th><th>跟不可数</th></tr>
<tr><td>some</td><td>一些（肯定句；邀请、请求的问句）</td><td>✔</td><td>✔</td></tr>
<tr><td>any</td><td>一些、任何（否定句、疑问句）</td><td>✔</td><td>✔</td></tr>
<tr><td>many</td><td>很多</td><td>✔</td><td></td></tr>
<tr><td>much</td><td>很多</td><td></td><td>✔</td></tr>
<tr><td>a lot of / lots of</td><td>很多</td><td>✔</td><td>✔</td></tr>
<tr><td>a few</td><td>一些（肯定，有）</td><td>✔</td><td></td></tr>
<tr><td>few</td><td>很少，几乎没有（否定）</td><td>✔</td><td></td></tr>
<tr><td>a little</td><td>一点（肯定，有）</td><td></td><td>✔</td></tr>
<tr><td>little</td><td>很少，几乎没有（否定）</td><td></td><td>✔</td></tr>
</table>
<p>⭐ 口诀：<b>有 a 是「有一些」，没 a 是「几乎没有」</b>。<br>
⭐ Would you like <b>some</b> tea?（邀请别人，问句也用 some）<br>
⭐ too much + 不可数（太多）；much too + 形容词（太…）：too much water / much too hot</p>
<h3>both / all / either / neither</h3>
<p>两者：<b>both</b> 两个都，<b>either</b> 两个中任何一个，<b>neither</b> 两个都不<br>
三者以上：<b>all</b> 全部，<b>none</b> 一个都没有</p>
</div>
<ex en="I have some friends in Oman." zh="我在阿曼有一些朋友。"/>
<ex en="Do you have any questions?" zh="你有什么问题吗？"/>
<ex en="There isn't much time left." zh="剩下的时间不多了。"/>
<ex en="How many brothers do you have?" zh="你有几个兄弟？"/>
<ex en="I can speak a little English." zh="我会说一点英语。"/>
<ex en="Both of my parents are doctors." zh="我父母都是医生。"/>
<quiz q="I don't have ___ money." opts="some|any|many" ans="1" why="否定句用 any；money 不可数也不能用 many。" en="I don't have any money."/>
<quiz q="He has ___ friends, so he feels lonely." opts="a few|few" ans="1" why="感到孤独，说明几乎没有朋友，用 few。" en="He has few friends, so he feels lonely."/>
`});

LESSONS.push({id:'tag', part:'第7部分 常用小语法', title:'43. 反意疑问句：…，对吧？', body:`
<div class="note">
<h3>结构：前肯后否，前否后肯</h3>
<p>You are a student, <b>aren't you</b>?（你是学生，对吧？）<br>
He doesn't like fish, <b>does he</b>?（他不喜欢鱼，对吧？）<br>
后面的小问句：用前面句子的<b>助动词/be/情态动词</b> + <b>代词</b>。</p>
<h3>特殊的几个</h3>
<p>I am…, <b>aren't I</b>?<br>
Let's…, <b>shall we</b>?<br>
祈使句…, <b>will you</b>?<br>
前面有 never / nothing / few / little 等否定词，后面用肯定：He never lies, <b>does he</b>?</p>
<h3>回答要看事实（容易错！）</h3>
<p>He doesn't like fish, does he?<br>
如果他<b>喜欢</b>：Yes, he does.（中文：不，他喜欢）<br>
如果他<b>不喜欢</b>：No, he doesn't.（中文：是的，他不喜欢）<br>
⭐ 英语里：事实是肯定就用 Yes，事实是否定就用 No。</p>
</div>
<ex en="It's a nice day, isn't it?" zh="今天天气不错，对吧？"/>
<ex en="You can swim, can't you?" zh="你会游泳，对吧？"/>
<ex en="She didn't come, did she?" zh="她没来，对吧？"/>
<ex en="Let's go, shall we?" zh="我们走吧，好吗？"/>
<quiz q="They live here, ___?" opts="do they|don't they|aren't they" ans="1" why="前面肯定，后面用否定；实义动词 live 用 do。" en="They live here, don't they?"/>
<quiz q="You aren't busy, are you?（你确实不忙）" opts="Yes, I am.|No, I'm not." ans="1" why="事实是不忙（否定），用 No。" en="No, I'm not."/>
`});

LESSONS.push({id:'reported', part:'第7部分 常用小语法', title:'44. 直接引语和间接引语', body:`
<p>转述别人说的话。直接引语：原话加引号；间接引语：用自己的话转述。</p>
<div class="note">
<h3>转换三步</h3>
<p>1. <b>人称换</b>：按说话人的角度变 I / you / he<br>
2. <b>时态往后退一步</b>（如果 said 是过去时）：<br>
一般现在 → 一般过去；现在进行 → 过去进行；一般过去/现在完成 → 过去完成；will → would；can → could<br>
3. <b>时间地点词换</b>：now → then，today → that day，tomorrow → the next day，yesterday → the day before，here → there，this → that</p>
<h3>例子</h3>
<p>He said, "I <b>am</b> busy." → He said (that) he <b>was</b> busy.<br>
She said, "I <b>will</b> come <b>tomorrow</b>." → She said she <b>would</b> come <b>the next day</b>.</p>
<h3>问句和命令</h3>
<p>一般疑问句用 if：He asked, "Are you OK?" → He asked <b>if</b> I was OK.<br>
特殊疑问句保留疑问词，改陈述语序：She asked, "Where do you live?" → She asked <b>where I lived</b>.<br>
命令用 tell / ask sb (not) to do：He said, "Sit down." → He told me <b>to sit</b> down.</p>
</div>
<ex en="She said that she was tired." zh="她说她累了。"/>
<ex en="He told me that he would call later." zh="他告诉我他晚点会打电话。"/>
<ex en="The customer asked if we had any discounts." zh="客户问我们有没有折扣。"/>
<ex en="My mom told me not to stay up late." zh="妈妈叫我别熬夜。"/>
<quiz q="He said, &quot;I like it.&quot; → He said he ___ it." opts="likes|liked|like" ans="1" why="said 是过去时，从句时态后退一步：like → liked。" en="He said he liked it."/>
`});

LESSONS.push({id:'it', part:'第7部分 常用小语法', title:'45. it 的用法和强调句', body:`
<div class="note">
<h3>① it 的常见用法</h3>
<p>1. 指东西「它」：Where is my phone? <b>It</b>'s on the desk.<br>
2. 天气：<b>It</b>'s raining.<br>
3. 时间、日期、距离：<b>It</b>'s 8 o'clock. / <b>It</b>'s Monday. / <b>It</b>'s 5 km from here.<br>
4. 指代后面的 to do / that 从句（形式主语）：<b>It</b> is hard <b>to say</b> goodbye.<br>
5. 花费时间：<b>It takes</b> me 20 minutes <b>to get</b> to work.（我上班要花 20 分钟）</p>
<h3>② 强调句：It is / was + 被强调部分 + that + 其余部分</h3>
<p>原句：Tom met Lucy in the park yesterday.<br>
强调 Tom：<b>It was</b> Tom <b>that/who</b> met Lucy in the park yesterday.（正是汤姆…）<br>
强调 yesterday：<b>It was</b> yesterday <b>that</b> Tom met Lucy in the park.<br>
💡 去掉 It was…that，句子仍然完整，就是强调句。</p>
<h3>③ 用 do / does / did 强调动词</h3>
<p>I <b>do</b> love you.（我真的爱你）He <b>did</b> come.（他确实来了）</p>
</div>
<ex en="It's very hot today." zh="今天很热。"/>
<ex en="It takes two hours to get there by car." zh="开车去那里要两个小时。"/>
<ex en="It is easy to make mistakes." zh="犯错误很容易。"/>
<ex en="It was my brother who helped me." zh="正是我哥哥帮了我。"/>
<ex en="I do want to help you." zh="我真的很想帮你。"/>
<quiz q="___ takes me ten minutes to walk to school." opts="It|This|That" ans="0" why="花费时间固定句型 It takes sb time to do。" en="It takes me ten minutes to walk to school."/>
`});

LESSONS.push({id:'soneither', part:'第7部分 常用小语法', title:'46. 我也是：So do I / Neither do I', body:`
<div class="note">
<h3>① 前面是肯定 → So + 助动词/be/情态 + 主语（…也是）</h3>
<p>I like tea. — <b>So do I.</b>（我也是）<br>
She is tired. — <b>So am I.</b><br>
He can swim. — <b>So can I.</b><br>
I went there. — <b>So did I.</b></p>
<h3>② 前面是否定 → Neither / Nor + 助动词 + 主语（…也不）</h3>
<p>I don't like it. — <b>Neither do I.</b>（我也不喜欢）<br>
口语也常说：Me too.（我也是）/ Me neither.（我也不）</p>
<h3>③ 区分 So I do（倒装 vs 不倒装）</h3>
<p>So do I. → 我<b>也</b>是（另一个人）<br>
So I do. → 我<b>确实</b>是（同一个人，表示同意）</p>
<h3>④ 其他倒装（了解即可）</h3>
<p>否定词放句首要倒装：<b>Never have I</b> seen such a thing.（我从没见过这种事）<br>
Only + 状语放句首：<b>Only then did I</b> understand.（直到那时我才明白）<br>
Here / There 开头：<b>Here comes</b> the bus.（公交车来了）</p>
</div>
<ex en="I love Chinese food. So do I." zh="我爱中国菜。我也是。"/>
<ex en="I can't swim. Neither can I." zh="我不会游泳。我也不会。"/>
<ex en="I'm hungry. Me too." zh="我饿了。我也是。"/>
<ex en="Here comes the bus." zh="公交车来了。"/>
<quiz q="She went to the party. ___" opts="So did I.|So do I.|Neither did I." ans="0" why="前面肯定、过去时，用 So did I。" en="So did I."/>
<quiz q="I'm not a student. ___" opts="So am I.|Neither am I." ans="1" why="前面否定，用 Neither。" en="Neither am I."/>
`});

;
LESSONS.push({id:'punct', part:'第8部分 总复习', title:'47. 标点、大写和缩写', body:`
<div class="note">
<h3>① 要大写的地方</h3>
<p>1. 句子第一个字母<br>
2. 代词 I<br>
3. 人名、地名、国家、语言：Tom, Beijing, China, English, Chinese<br>
4. 星期、月份、节日：Monday, January, Christmas, Spring Festival（季节不大写：spring）<br>
5. 标题里的主要单词</p>
<h3>② 英文标点和中文的区别</h3>
<table>
<tr><th>标点</th><th>英文</th><th>中文</th><th>注意</th></tr>
<tr><td>句号</td><td>.</td><td>。</td><td>英文是实心小点</td></tr>
<tr><td>逗号</td><td>,</td><td>，</td><td></td></tr>
<tr><td>顿号</td><td>没有，用逗号</td><td>、</td><td>apples, bananas and pears</td></tr>
<tr><td>书名号</td><td>没有，用斜体或引号</td><td>《》</td><td></td></tr>
<tr><td>省略号</td><td>...（三个点）</td><td>……（六个点）</td><td></td></tr>
<tr><td>撇号</td><td>'</td><td>无</td><td>缩写 don't，所有格 Tom's</td></tr>
</table>
<p>⭐ 英文标点后面要<b>空一格</b>再写下一个词。</p>
<h3>③ 常用缩写</h3>
<p>I'm = I am，you're = you are，it's = it is，don't = do not，can't = cannot，won't = will not，I'll = I will，I've = I have，I'd = I would / I had，let's = let us<br>
⚠️ <b>it's</b>（= it is）和 <b>its</b>（它的）不一样！</p>
</div>
<ex en="My name is Li Hua. I'm from China." zh="我叫李华。我来自中国。"/>
<ex en="I like apples, bananas and oranges." zh="我喜欢苹果、香蕉和橙子。" tip="中文顿号在英语里用逗号"/>
<ex en="It's Monday. The dog is wagging its tail." zh="今天星期一。狗在摇它的尾巴。" tip="It's = It is；its = 它的"/>
<quiz q="哪一个对？" opts="i live in china.|I live in China." ans="1" why="句首、I、国家名都要大写。" en="I live in China."/>
`});

LESSONS.push({id:'mistakes', part:'第8部分 总复习', title:'48. 中国人最常犯的 15 个错误', body:`
<div class="note">
<table>
<tr><th>#</th><th>❌ 错误</th><th>✅ 正确</th><th>原因</th></tr>
<tr><td>1</td><td>I very like it.</td><td>I like it very much.</td><td>very 不能直接修饰动词</td></tr>
<tr><td>2</td><td>I am agree.</td><td>I agree.</td><td>agree 是动词，不需要 am</td></tr>
<tr><td>3</td><td>She go to work.</td><td>She goes to work.</td><td>三单加 s</td></tr>
<tr><td>4</td><td>He don't know.</td><td>He doesn't know.</td><td>三单用 doesn't</td></tr>
<tr><td>5</td><td>I didn't went.</td><td>I didn't go.</td><td>didn't 后用原形</td></tr>
<tr><td>6</td><td>I busy.</td><td>I am busy.</td><td>形容词前要 be</td></tr>
<tr><td>7</td><td>Because…, so…</td><td>Because…, …</td><td>because 和 so 只用一个</td></tr>
<tr><td>8</td><td>Although…, but…</td><td>Although…, …</td><td>although 和 but 只用一个</td></tr>
<tr><td>9</td><td>I have a good news.</td><td>I have some good news.</td><td>news 不可数</td></tr>
<tr><td>10</td><td>Where is he go?</td><td>Where does he go?</td><td>实义动词问句要 do/does</td></tr>
<tr><td>11</td><td>Tell me where is it.</td><td>Tell me where it is.</td><td>从句用陈述语序</td></tr>
<tr><td>12</td><td>I am boring.（想说我觉得无聊）</td><td>I am bored.</td><td>人感到用 -ed</td></tr>
<tr><td>13</td><td>He is a teacher, she is a doctor.</td><td>He is a teacher, and she is a doctor.</td><td>两个句子不能只用逗号连</td></tr>
<tr><td>14</td><td>If it will rain, …</td><td>If it rains, …</td><td>主将从现</td></tr>
<tr><td>15</td><td>Open the light.</td><td>Turn on the light.</td><td>开灯/电器用 turn on</td></tr>
</table>
</div>
<ex en="I like it very much." zh="我非常喜欢它。"/>
<ex en="I agree with you." zh="我同意你的看法。"/>
<ex en="I have some good news for you." zh="我有个好消息要告诉你。"/>
<ex en="Please turn on the light." zh="请开灯。"/>
`});

LESSONS.push({id:'final', part:'第8部分 总复习', title:'49. 总测验', body:`
<p>做完这 15 道题，看看你掌握了多少。错的题回到对应课复习。</p>
<quiz q="1. My father ___ a driver." opts="am|is|are" ans="1" why="第6课：单数用 is。" en="My father is a driver."/>
<quiz q="2. I have two ___." opts="child|childs|children" ans="2" why="第3课：child 的复数是 children。" en="I have two children."/>
<quiz q="3. She ___ coffee every morning." opts="drink|drinks|drinking" ans="1" why="第7、20课：三单 + 一般现在时。" en="She drinks coffee every morning."/>
<quiz q="4. ___ you like music?" opts="Are|Do|Does" ans="1" why="第14课：you + 实义动词，用 Do。" en="Do you like music?"/>
<quiz q="5. Look! The baby ___." opts="sleeps|is sleeping|slept" ans="1" why="第21课：Look! 表示正在进行。" en="Look! The baby is sleeping."/>
<quiz q="6. We ___ a movie last night." opts="see|saw|seen" ans="1" why="第22、30课：过去时 saw。" en="We saw a movie last night."/>
<quiz q="7. I ___ visit my aunt tomorrow." opts="will|am|did" ans="0" why="第24课：将来时 will + 原形。" en="I will visit my aunt tomorrow."/>
<quiz q="8. Have you ever ___ to Paris?" opts="go|went|been" ans="2" why="第25课：have been to 去过。" en="Have you ever been to Paris?"/>
<quiz q="9. This car is ___ than that one." opts="expensive|more expensive|most expensive" ans="1" why="第9课：长单词比较级用 more。" en="This car is more expensive than that one."/>
<quiz q="10. The goods ___ yesterday." opts="shipped|were shipped|ship" ans="1" why="第29课：货物被发出，被动语态。" en="The goods were shipped yesterday."/>
<quiz q="11. I enjoy ___ books." opts="read|to read|reading" ans="2" why="第32课：enjoy doing。" en="I enjoy reading books."/>
<quiz q="12. The girl ___ is singing is my sister." opts="who|which|where" ans="0" why="第38课：指人用 who。" en="The girl who is singing is my sister."/>
<quiz q="13. If it ___ tomorrow, I'll stay home." opts="rains|will rain" ans="0" why="第39课：主将从现。" en="If it rains tomorrow, I'll stay home."/>
<quiz q="14. If I ___ you, I would say sorry." opts="am|were|be" ans="1" why="第40课：虚拟语气用 were。" en="If I were you, I would say sorry."/>
<quiz q="15. Do you know where ___?" opts="does she live|she lives" ans="1" why="第37课：从句用陈述语序。" en="Do you know where she lives?"/>
<div class="kj">🎉 恭喜你学完了全部语法！接下来最重要的是<b>每天读、每天听、每天说</b>。语法是骨架，单词是血肉，多听多读才能真正用起来。</div>
`});

const synth = window.speechSynthesis;
function say(t) {
  if (!synth) return alert('这个浏览器不支持朗读');
  synth.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US'; u.rate = 0.8;
  const v = synth.getVoices().find(x => /en-US/.test(x.lang)); if (v) u.voice = v;
  synth.speak(u);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function renderLesson(html) {
  return html
    .replace(/<ex en="([^"]*)" zh="([^"]*)"(?: tip="([^"]*)")?\s*\/>/g, (m, en, zh, tip) =>
      '<div class="ex"><button class="play" data-say="' + esc(en) + '">▶</button><div><div class="en">' + esc(en) + '</div><div>' + zh + '</div>' + (tip ? '<div class="tip">💡 ' + tip + '</div>' : '') + '</div></div>')
    .replace(/<quiz q="([^"]*)" opts="([^"]*)" ans="(\d+)" why="([^"]*)"(?: en="([^"]*)")?\s*\/>/g, (m, q, opts, ans, why, en) =>
      '<div class="q" data-why="' + esc(why) + '" data-en="' + esc(en || '') + '"><div>📝 ' + q + '</div>' +
      opts.split('|').map((o, i) => '<button class="opt" data-ok="' + (i == ans ? 1 : 0) + '">' + o + '</button>').join('') + '<div class="fb"></div></div>');
}

    '<div class="card"><h3>这份计划依据什么</h3><ul>' +
    '<li>课程表：第 12～16 周（2026-11-24 至 12-27）；第 17 周起是期末考试周（元旦前后），排到 2027-01-05，每天以复习为主。</li>' +
    '<li>无人机理论考试 12 月 8 日：11/24～12/2 把题库平分成 9 天刷第一遍，12/3～12/7 每天模拟考 + 错题。12/8 上午在佛山考，当天 5:50 起床。题库总数按 3000 题估算，在任一刷题块里改成你 App 的实际题数，每天的题号会自动重算。</li>' +
    '<li>独立站：《广州OPC独立站项目计划书》第 12 章前 90 天，从 11/23 这周算第 1 周。期末两周每件业务控制在 1 小时内。货代收尾和阿曼的任务已经删掉。</li>' +
    '<li>英语：用 ' + WAPP.app + ' 每天 20 个新词（早上）+ 睡前过一遍 + 语法手册 1 课（周六 2 课，周日复习）。AI 口语陪练不再排进计划。</li>' +
    '<li>化妆：每周日 14:00～15:00 练一个部位，第 16 周整妆计时。</li></ul>' +
    '<p class="tip">期末每门课的具体日期出来后，告诉 Claude，把考前一天排成这门课的冲刺。</p></div>';
}

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('daybar').style.display = tab === 'day' ? '' : 'none';
  ({day: renderDay, week: renderWeek, gym: renderGym, food: renderFood, gram: renderGram, eng: renderEng, help: renderHelp})[tab]();
  const m = $('main'); m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); setTimeout(() => m.classList.remove('enter'), 900);
  if (tab !== 'day') window.scrollTo(0, 0);
}

// 打满 100% 时撒一把彩纸
function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#ff7aa2', '#ffb84d', '#7c5cff', '#2ec4b6', '#ffd23f'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('i');
    s.style.cssText = 'left:' + Math.random() * 100 + '%;background:' + cols[i % 5] + ';animation-delay:' + Math.random() * 0.3 + 's;--x:' + (Math.random() * 120 - 60) + 'px;--r:' + Math.random() * 720 + 'deg';
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2200);
}

function toggleDone(i) {
  const d = S.get('done:' + cur, {}); d[i] = !d[i]; S.set('done:' + cur, d);
  const it = document.querySelector('.item[data-i="' + i + '"]');
  if (it) { it.classList.toggle('done', !!d[i]); if (d[i]) { it.classList.remove('pop'); void it.offsetWidth; it.classList.add('pop'); } }
  if (renderHead() === 100 && d[i]) confetti();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ck],[data-go],[data-tab],[data-l],[data-mark],[data-say],.opt,#prev,#next,#today,#lclose,#exp,.item');
  if (!t) return;
  if (t.dataset.ck != null) { toggleDone(t.dataset.ck); return; }
  if (t.dataset.go) { cur = t.dataset.go; tab = 'day'; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.dataset.l != null) { openLesson(+t.dataset.l); return; }
  if (t.dataset.mark != null) { const i = +t.dataset.mark, id = LESSONS[i].id, d = S.get('gram', []), k = d.indexOf(id); k >= 0 ? d.splice(k, 1) : d.push(id); S.set('gram', d); openLesson(i); return; }
  if (t.dataset.say) { say(t.dataset.say); return; }
  if (t.classList.contains('opt')) {
    const q = t.closest('.q'); if (q.dataset.done) return; q.dataset.done = 1;
    const ok = t.dataset.ok === '1'; t.classList.add(ok ? 'right' : 'wrong');
    q.querySelectorAll('.opt').forEach(b => b.dataset.ok === '1' && b.classList.add('right'));
    q.querySelector('.fb').textContent = (ok ? '✅ 答对了！' : '❌ 再看看：') + ' ' + q.dataset.why;
    if (q.dataset.en) say(q.dataset.en); return;
  }
  if (t.id === 'prev' || t.id === 'next') {
    const n = ymd(new Date(parse(cur).getTime() + (t.id === 'prev' ? -MS : MS)));
    if (n >= PLAN_START && n <= PLAN_END) { cur = n; tab = 'day'; render(); window.scrollTo(0, 0); } return;
  }
  if (t.id === 'today') { const k = ymd(new Date()); cur = k < PLAN_START ? PLAN_START : k > PLAN_END ? PLAN_END : k; tab = 'day'; render(); return; }
  if (t.id === 'lclose') { $('lesson').classList.remove('show'); if (synth) synth.cancel(); if (tab === 'gram') renderGram(); return; }
  if (t.id === 'exp') {
    const o = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('plan:')) o[k] = localStorage.getItem(k); }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], {type: 'application/json'}));
    a.download = '每日计划备份-' + ymd(new Date()) + '.json'; a.click(); return;
  }
  if (t.classList.contains('item') && !e.target.closest('button,a,input,textarea,label')) t.classList.toggle('open');
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.goal != null) { const k = 'goal:' + weekOf(parse(cur)), g = S.get(k, {}); g[t.dataset.goal] = t.checked; S.set(k, g); }
  if (t.dataset.drtotal != null) { const n = parseInt(t.value, 10); if (n > 0) { S.set('drTotal', n); renderDay(); } }
  if (t.id === 'imp' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); Object.keys(o).forEach(k => k.startsWith('plan:') && localStorage.setItem(k, o[k])); alert('已恢复'); render(); } catch (x) { alert('文件不对'); } };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.log == null) return;
  const lg = S.get('log:' + cur, {}); lg[t.dataset.log] = t.value; S.set('log:' + cur, lg);
});

render();
setInterval(() => { if (tab === 'day' && cur === ymd(new Date()) && !document.querySelector('.item.open') && document.activeElement.tagName === 'BODY') renderDay(); }, 300000);


</script>
</body>
</html>
